openapi: 3.1.0
info:
  title: Nelisa API
  version: 0.1.0
  description: |
    Contrato da API do Nelisa. Quem muda um endpoint muda este arquivo no
    mesmo PR; o cliente TypeScript do web/ é gerado a partir dele.
    Rotas públicas em /api/public (filtradas pela regra de visibilidade);
    rotas da equipe em /api/team (sempre autenticadas, exceto
    /api/team/auth).

    Sessão: o login devolve um token de acesso (JWT, 15 min) no corpo, para
    o header `Authorization: Bearer`, e o refresh token no cookie
    `nelisa_refresh` (HttpOnly; Secure; SameSite=Strict;
    Path=/api/team/auth). O front guarda o token de acesso só em memória e
    chama /api/team/auth/refresh quando ele expira. Sem CORS: o Next faz
    proxy de /api na mesma origem.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: sistema
  - name: sessão
  - name: conta
  - name: equipe
  - name: fontes
  - name: proposições
  - name: ciclo editorial
  - name: fila
  - name: público
paths:
  /version:
    get:
      tags: [sistema]
      summary: Versão do binário em execução
      security: []
      responses:
        "200":
          description: Versão
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
  /healthz:
    get:
      tags: [sistema]
      summary: Saúde da API e do banco
      security: []
      responses:
        "200": { description: Saudável }
        "503":
          description: Banco indisponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/team/auth/bootstrap:
    post:
      tags: [sessão]
      summary: Cria a primeira pessoa da equipe, como Admin
      description: |
        Só funciona com `BOOTSTRAP_TOKEN` configurado no servidor e enquanto
        não houver nenhum usuário. Limite de 10 requisições por minuto por
        IP (compartilhado com o login).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapRequest" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: "`bootstrap_disabled` (sem BOOTSTRAP_TOKEN) ou `bootstrap_token_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`already_bootstrapped`: já existe usuário"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/team/auth/login:
    post:
      tags: [sessão]
      summary: Entra com e-mail e senha
      description: Limite de 10 requisições por minuto por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_credentials`: e-mail ou senha incorretos (não diz qual)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`account_deactivated`: senha certa, mas a conta foi desativada"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/team/auth/refresh:
    post:
      tags: [sessão]
      summary: Troca o refresh token do cookie por uma sessão nova
      description: |
        O refresh token gira a cada uso (o cookie é substituído). Um token já
        usado que volta depois de 30 s encerra todas as sessões da pessoa.
        Limite de 30 requisições por minuto por IP.
      security:
        - refreshCookie: []
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401":
          description: "`invalid_refresh_token`: cookie ausente, desconhecido, expirado ou reusado; o cookie é apagado"
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/team/auth/logout:
    post:
      tags: [sessão]
      summary: Encerra a sessão do cookie
      description: Idempotente; sem cookie também responde 204.
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Sessão apagada e cookie limpo
          headers:
            Set-Cookie:
              schema: { type: string }

  /api/team/me:
    get:
      tags: [conta]
      summary: Dados da pessoa logada
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/team/me/password:
    post:
      tags: [conta]
      summary: Troca a própria senha
      description: |
        Exige a senha atual. Encerra todas as sessões da pessoa, inclusive a
        atual, e devolve uma sessão nova (token de acesso e cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`wrong_password`: a senha atual não confere"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`credentials_changed`: a senha mudou nesse meio-tempo"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/team/users:
    get:
      tags: [equipe]
      summary: Lista a equipe (só Admin)
      responses:
        "200":
          description: Usuários, do cadastro mais antigo ao mais novo
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [equipe]
      summary: Cadastra uma pessoa (só Admin)
      description: |
        Sem convite nem e-mail (ADR 0001): o Admin define a senha inicial,
        que é temporária (`must_change_password: true`). Registrado na
        Auditoria (`user.create`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`email_taken`: e-mail já cadastrado (sem diferenciar maiúsculas)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    patch:
      tags: [equipe]
      summary: Troca a role de alguém (só Admin)
      description: |
        Nunca deixa o Nelisa sem Admin. Vale na próxima requisição da
        pessoa. Registrado na Auditoria (`user.role_change`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleRequest" }
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409":
          description: "`last_admin`: rebaixaria o último Admin"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/users/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [equipe]
      summary: Desativa alguém (só Admin)
      description: |
        Ninguém é excluído: a conta fica, porque Auditoria, Autoria e
        aprovações apontam para ela. O login passa a ser recusado
        (`account_deactivated`) e todas as sessões acabam na hora.
        Desativar quem já está desativado não muda nada. Registrado na
        Auditoria (`user.deactivate`).
      responses:
        "200":
          description: Usuário desativado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409":
          description: "`cannot_deactivate_self` ou `last_admin` (último Admin ativo)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/users/{id}/reactivate:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [equipe]
      summary: Reativa alguém (só Admin)
      description: |
        A pessoa volta a entrar com a senha que tinha; sessões de antes da
        desativação seguem encerradas. Registrado na Auditoria
        (`user.reactivate`).
      responses:
        "200":
          description: Usuário ativo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
  /api/team/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [equipe]
      summary: Reseta a senha de alguém (só Admin)
      description: |
        A nova senha é temporária e todas as sessões da pessoa acabam.
        Registrado na Auditoria (`user.password_reset`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Senha trocada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409":
          description: "`credentials_changed`: a senha mudou nesse meio-tempo"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/team/sources/search:
    get:
      tags: [fontes]
      summary: Busca uma Proposição pelo nome oficial nas Casas com API (Editor ou acima)
      description: |
        Consulta todas as fontes configuradas (Câmara e Senado) por Tipo,
        número e ano. Uma Casa fora do ar vem com `unavailable: true` e as
        outras seguem. Cada registro diz se já está ligado a uma Proposição
        (`link_state`: `confirmed` ou `suggested`).
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, example: PEC } }
        - { name: number, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 1800 } }
      responses:
        "200":
          description: Resultado por Casa
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/SourceSearchResult" }
        "400":
          description: "`invalid_query`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/team/propositions/import:
    post:
      tags: [fontes]
      summary: Importa uma Proposição de uma Casa (Editor ou acima)
      description: |
        Busca o registro e a Tramitação na Casa escolhida e cria a
        Proposição em `draft`, com o Vínculo de fonte dessa Casa confirmado
        (escolher o registro é confirmar). Procura a mesma Proposição nas
        outras Casas e grava o que achar como Vínculo **sugerido**: nada é
        confirmado sozinho. Falha na Casa escolhida não grava nada (503);
        falha só na procura de candidatos não impede a Importação e aparece
        em `suggestions_unavailable`. Importar de novo um registro já
        vinculado devolve 200 com a Proposição existente. Registrado na
        Auditoria (`proposition.import`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: O registro já estava vinculado; nada foi criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "201":
          description: Proposição criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400":
          description: "`invalid_json`, `unknown_chamber` ou `invalid_external_id`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`source_record_not_found`: a Casa não tem esse registro"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `already_suggested` (o registro é sugestão de Vínculo de uma
            Proposição: confirme lá), `proposition_exists` (mesma Casa
            iniciadora, Tipo, número e ano, ligada a outro registro) ou
            `link_taken`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`source_unavailable`: a fonte oficial falhou; nada foi gravado"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions:
    get:
      tags: [proposições]
      summary: Lista as Proposições para a equipe (Editor ou acima)
      description: Todas, em qualquer estado de Revisão, com Vínculos de fonte e a última Sincronização de cada um.
      responses:
        "200":
          description: Proposições, da atualizada mais recentemente para a mais antiga
          content:
            application/json:
              schema:
                type: object
                required: [propositions]
                properties:
                  propositions:
                    type: array
                    items: { $ref: "#/components/schemas/TeamProposition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/team/propositions/{id}:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
    get:
      tags: [proposições]
      summary: Uma Proposição como a equipe a vê (Editor ou acima)
      description: |
        Traz também o ciclo editorial: Versões, conteúdo da Versão em
        análise e da vigente, Posse, Selo, aprovação da vigente e as
        decisões de permissão para quem pergunta (`can_edit`,
        `can_create_version`, `can_approve` com `approve_blockers`,
        `approval_breaks_four_eyes`, `can_second_review`). O front não
        decide: mostra o que a API diz.
      responses:
        "200":
          description: Proposição com Vínculos, Apensação, Tramitação e ciclo editorial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamPropositionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PropositionNotFound" }
  /api/team/propositions/{id}/submit-for-review:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
    post:
      tags: [proposições]
      summary: Envia para revisão (criado → em revisão) (Editor ou acima)
      description: |
        A partir daqui a parte pública mostra a Proposição "em análise", só
        com dados oficiais. Registrado na Auditoria
        (`proposition.submit_for_review`). Marcar como pronto é da fase 2.
      responses:
        "200":
          description: Novo estado
          content:
            application/json:
              schema:
                type: object
                required: [id, review_state]
                properties:
                  id: { type: string, format: uuid }
                  review_state: { $ref: "#/components/schemas/ReviewState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PropositionNotFound" }
        "409":
          description: "`invalid_review_transition`: a Proposição não está em `draft`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/links/{linkId}/confirm:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/LinkID"
    post:
      tags: [proposições]
      summary: Confirma um Vínculo de fonte sugerido (Editor ou acima)
      description: |
        Só o Editor confirma (ADR 0006). A Sincronização do Vínculo é
        enfileirada na mesma transação. Registrado na Auditoria
        (`source_link.confirm`).
      responses:
        "200":
          description: Vínculo confirmado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/LinkNotFound" }
        "409":
          description: |
            `link_not_suggested` (já confirmado), `link_taken` (o registro
            já está confirmado em outra Proposição) ou
            `chamber_already_linked` (a Proposição já tem Vínculo confirmado
            nessa Casa).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/links/{linkId}/reject:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/LinkID"
    post:
      tags: [proposições]
      summary: Descarta um Vínculo de fonte sugerido (Editor ou acima)
      description: Registrado na Auditoria (`source_link.reject`).
      responses:
        "204": { description: Descartado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/LinkNotFound" }
        "409":
          description: "`link_not_suggested`: vínculo confirmado não se descarta"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/team/propositions/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
    post:
      tags: [ciclo editorial]
      summary: Registra uma Versão nova do Documento integral (Editor ou acima)
      description: |
        Só sem Versão em análise. A Proposição pronta volta para
        `in_review`; o conteúdo da Versão vigente é copiado para a nova
        marcado a confirmar (`needs_confirmation`), com a mesma Autoria.
        Quem registra assume a Posse (409 `claim_taken` se ela é de outra
        pessoa). Registrado na Auditoria (`version.create`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVersionRequest" }
      responses:
        "201":
          description: Versão criada (em análise) e o conteúdo dela
          content:
            application/json:
              schema:
                type: object
                required: [version, content]
                properties:
                  version: { $ref: "#/components/schemas/PropositionVersion" }
                  content: { $ref: "#/components/schemas/VersionContent" }
        "400":
          description: "`invalid_json`, `invalid_label` ou `invalid_official_text_url`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PropositionNotFound" }
        "409":
          description: "`pending_version_exists` ou `claim_taken` (a mensagem traz o nome de quem tem a Posse)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/content:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    put:
      tags: [ciclo editorial]
      summary: Grava Resumo, Resumo curto e Temas da Versão em análise (Editor ou acima)
      description: |
        Só a Versão em análise é editável. Exige a Posse: se está livre
        (ou expirada, ou de conta desativada) é assumida; se é de outra
        pessoa, 409 `claim_taken`. Trava otimista: mande o `revision` lido;
        se alguém gravou depois, 409 `stale_content` e nada muda. Quem grava
        entra na Autoria (`authors`). Salvar não confirma conteúdo trazido.
        Gravação sem mudança só renova a atividade da Posse. Registrado na
        Auditoria (`content.update`, com os campos alterados, nunca o texto).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContentRequest" }
      responses:
        "200":
          description: Conteúdo gravado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionContent" }
        "400":
          description: |
            `invalid_json` (inclusive sem `revision`), `summary_too_long`,
            `short_summary_too_long`, `too_many_topics`, `duplicate_topic` ou
            `topic_inactive` (Tema desativado só fica se já estava escolhido).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found`, `version_not_found` ou `topic_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`claim_taken`, `stale_content` ou `version_not_editable` (Versão vigente ou substituída)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/content/confirm:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    post:
      tags: [ciclo editorial]
      summary: Confirma o conteúdo trazido da Versão anterior (Editor ou acima)
      description: |
        Ação explícita, separada de gravar. Exige a Posse como gravar e o
        `revision` lido (confirma-se o que se viu). Quem confirma entra na
        Autoria. Registrado na Auditoria (`content.confirm`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmContentRequest" }
      responses:
        "200":
          description: Conteúdo confirmado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionContent" }
        "400":
          description: "`invalid_json`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found` ou `version_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`claim_taken`, `stale_content`, `version_not_editable` ou `nothing_to_confirm`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/approve:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    post:
      tags: [ciclo editorial]
      summary: Aprova (marca como pronta) a Versão em análise (Revisor ou Admin)
      description: |
        Não exige Posse. A Proposição precisa estar `in_review` e o
        conteúdo completo (Resumo e Resumo curto, 1 a 3 Temas ativos, nada a
        confirmar). Quatro olhos: quem está na Autoria não aprova (403
        `four_eyes`), exceto o Admin, que aprova sem quatro olhos
        (`four_eyes: false`, Selo 1, Segunda revisão pendente). Na mesma
        transação: a Versão vira a vigente, a anterior é substituída, a
        Proposição fica `ready`, a Posse é solta e a Auditoria registra
        (`review.approve`). Falha em qualquer passo desfaz tudo.

        O corpo leva a `revision` do conteúdo que o Revisor leu: se alguém
        gravou depois, a aprovação é recusada (409 `stale_content`), para
        ninguém aprovar texto que não viu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: { type: integer, description: "revision do conteúdo em análise que quem aprova leu" }
      responses:
        "200":
          description: Aprovada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (Editor) ou `four_eyes`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`proposition_not_found` ou `version_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `content_incomplete` (a mensagem lista o que falta),
            `stale_content` (o conteúdo mudou desde a leitura),
            `version_not_pending` ou `invalid_review_transition` (rascunho).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/second-review:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    post:
      tags: [ciclo editorial]
      summary: Confirma a segunda revisão de uma aprovação sem quatro olhos (Revisor ou Admin)
      description: |
        Só para a Versão vigente aprovada sem quatro olhos. Quem aprovou e
        quem está na Autoria não fazem a segunda (403 `four_eyes`). O Selo
        passa a 2. Registrado na Auditoria (`review.second_review`).
      responses:
        "200":
          description: Segunda revisão registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (Editor) ou `four_eyes`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`proposition_not_found` ou `version_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`no_second_review_pending`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/claim:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
    post:
      tags: [fila]
      summary: Assume a Posse da Proposição (Editor ou acima)
      description: |
        Se outra pessoa tem a Posse e ela vale, 409 `claim_taken` com o nome
        dela na mensagem. A Posse expira com 3 dias sem atividade; Posse de
        conta desativada vale como livre. Assumir a própria só renova.
      responses:
        "200":
          description: Posse assumida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Claim" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PropositionNotFound" }
        "409":
          description: "`claim_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [fila]
      summary: Solta a Posse (quem a tem, ou Revisor/Admin)
      description: |
        Revisor e Admin soltam a Posse de qualquer um; isso fica na
        Auditoria (`claim.release`). Sem Posse, não faz nada.
      responses:
        "204": { description: Solta (ou já estava livre) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/team/queue:
    get:
      tags: [fila]
      summary: Fila de revisão (Editor ou acima)
      description: |
        Proposições `in_review` com Versão em análise (`reason: review`) e
        Proposições `ready` com Segunda revisão pendente
        (`reason: second_review`). Ordem: Esfera (federal > estadual >
        municipal), depois votação mais próxima (ainda sem dado: todas "sem
        votação"), depois mais antigo na fila primeiro.
      parameters:
        - name: sphere
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Sphere" }
      responses:
        "200":
          description: Itens da Fila
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/QueueItem" }
        "400":
          description: "`invalid_sphere`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/team/topics:
    get:
      tags: [ciclo editorial]
      summary: Lista os Temas, ativos e desativados (Editor ou acima)
      description: Desativados não devem ser oferecidos na escolha; continuam nas Versões que já os usam.
      responses:
        "200":
          description: Temas por nome
          content:
            application/json:
              schema:
                type: object
                required: [topics]
                properties:
                  topics:
                    type: array
                    items: { $ref: "#/components/schemas/Topic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [ciclo editorial]
      summary: Cria um Tema (só Admin)
      description: Registrado na Auditoria (`topic.create`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        "201":
          description: Tema criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        "400":
          description: "`invalid_json` ou `invalid_topic_name`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`topic_name_taken` (sem diferenciar maiúsculas)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/topics/{topicId}:
    parameters:
      - name: topicId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [ciclo editorial]
      summary: Renomeia, desativa ou reativa um Tema (só Admin)
      description: Registrado na Auditoria (`topic.rename`, `topic.deactivate`, `topic.reactivate`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 60 }
                active: { type: boolean }
      responses:
        "200":
          description: Tema atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        "400":
          description: "`invalid_json` ou `invalid_topic_name`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`topic_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`topic_name_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/public/propositions:
    get:
      tags: [público]
      summary: Proposições visíveis ao Leitor
      description: |
        Só `in_review` e `ready`. Rascunhos nunca aparecem. Sem Versão
        vigente aparece como "em análise" (`under_review: true`), só com
        dados oficiais; com vigente, ganha Resumo, Resumo curto, Temas e
        Selo dela, e o aviso de texto novo em análise se houver.
      security: []
      responses:
        "200":
          description: Proposições públicas
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
          content:
            application/json:
              schema:
                type: object
                required: [propositions]
                properties:
                  propositions:
                    type: array
                    items: { $ref: "#/components/schemas/PublicProposition" }
  /api/public/propositions/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: Identificador público estável ("pec-221-2019")
        schema: { type: string, example: pec-221-2019 }
    get:
      tags: [público]
      summary: Página pública de uma Proposição
      description: Rascunho ou inexistente respondem 404 igual, sem revelar que existe.
      security: []
      responses:
        "200":
          description: Proposição com Tramitação
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPropositionDetail" }
        "404": { $ref: "#/components/responses/PropositionNotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso devolvido por login, bootstrap, refresh ou troca de senha.
    refreshCookie:
      type: apiKey
      in: cookie
      name: nelisa_refresh
      description: Refresh token opaco, HttpOnly; o navegador o envia sozinho para /api/team/auth.
  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PropositionID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionID:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LinkID:
      name: linkId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    PropositionNotFound:
      description: "`proposition_not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LinkNotFound:
      description: "`link_not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Session:
      description: |
        Sessão aberta. O refresh token vai só no cookie `nelisa_refresh`;
        nunca no corpo.
      headers:
        Set-Cookie:
          description: "nelisa_refresh=...; Path=/api/team/auth; HttpOnly; Secure; SameSite=Strict"
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    BadRequest:
      description: |
        Entrada inválida: `invalid_json`, `invalid_email`, `invalid_name`,
        `invalid_role`, `password_too_short` (mínimo 8 caracteres) ou
        `password_too_long` (máximo 72 bytes).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`unauthenticated` (sem token ou token inválido) ou `session_expired` (token de antes de troca/reset de senha)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`forbidden`: a role não permite a ação"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UserNotFound:
      description: "`user_not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: "`too_many_requests`: limite por IP excedido"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Version:
      type: object
      required: [version, commit, changelog, build_time]
      properties:
        version: { type: string }
        commit: { type: string }
        changelog: { type: string }
        build_time: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "snake_case estável, para o código tratar" }
            message: { type: string, description: "Texto para a tela, em português" }
    Role:
      type: string
      enum: [editor, reviewer, admin]
      description: Editor ⊂ Revisor (reviewer) ⊂ Admin.
    User:
      type: object
      required: [id, name, email, role, must_change_password, active, deactivated_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        must_change_password:
          type: boolean
          description: Senha definida pelo Admin (temporária). A troca obrigatória ainda não é aplicada.
        active:
          type: boolean
          description: Falso quando o Admin desativou a conta.
        deactivated_at:
          type: [string, "null"]
          format: date-time
          description: Quando a conta foi desativada; null se ativa.
        created_at: { type: string, format: date-time }
    Session:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token: { type: string, description: JWT para o header Authorization }
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time, description: Quando o token de acesso expira }
        user: { $ref: "#/components/schemas/User" }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [token, name, email, password]
      properties:
        token: { type: string, description: Valor de BOOTSTRAP_TOKEN }
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, role]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, description: Senha inicial, temporária }
        role: { $ref: "#/components/schemas/Role" }
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 8, description: Nova senha, temporária }
    Chamber:
      type: string
      enum: [camara, senado]
      description: Casa legislativa com API (v1).
    ReviewState:
      type: string
      enum: [draft, in_review, ready]
      description: "Revisão: criado (draft), em revisão (in_review, \"em análise\" para o Leitor), pronto (ready)."
    SourceSearchHit:
      type: object
      required: [external_id, name, kind, number, year, official_summary, presented_at, authors, status, source_url, linked_proposition_id, link_state]
      properties:
        external_id: { type: string }
        name: { type: string, example: PEC 221/2019 }
        kind: { type: string }
        number: { type: integer }
        year: { type: integer }
        official_summary: { type: string, description: Ementa oficial (da fonte) }
        presented_at: { type: [string, "null"], format: date-time }
        authors: { type: array, items: { type: string } }
        status: { type: string }
        source_url: { type: string, description: Página pública na Casa }
        linked_proposition_id:
          type: [string, "null"]
          format: uuid
          description: Proposição a que o registro já está ligado, se houver
        link_state:
          type: [string, "null"]
          enum: [confirmed, suggested, null]
    SourceSearchResult:
      type: object
      required: [chamber, unavailable, hits]
      properties:
        chamber: { $ref: "#/components/schemas/Chamber" }
        unavailable: { type: boolean, description: A fonte falhou nesta busca }
        hits:
          type: array
          items: { $ref: "#/components/schemas/SourceSearchHit" }
    ImportRequest:
      type: object
      additionalProperties: false
      required: [chamber, external_id]
      properties:
        chamber: { $ref: "#/components/schemas/Chamber" }
        external_id: { type: string, maxLength: 64, description: ID do registro na API da Casa }
    ImportResult:
      type: object
      required: [proposition_id, created, suggested_links, suggestions_unavailable]
      properties:
        proposition_id: { type: string, format: uuid }
        created: { type: boolean }
        suggested_links: { type: integer, description: Vínculos de outras Casas sugeridos para o Editor conferir }
        suggestions_unavailable:
          type: array
          items: { $ref: "#/components/schemas/Chamber" }
          description: Casas que não responderam à procura de candidatos
    SourceLink:
      type: object
      description: Vínculo de fonte (só a equipe vê estes campos).
      required: [id, chamber, external_id, state, source_name, source_url, confirmed_by, confirmed_at, last_synced_at, last_sync_error, created_at]
      properties:
        id: { type: string, format: uuid }
        chamber: { $ref: "#/components/schemas/Chamber" }
        external_id: { type: string }
        state: { type: string, enum: [suggested, confirmed] }
        source_name: { type: string, description: Como a Casa chama a Proposição }
        source_url: { type: string }
        confirmed_by: { type: [string, "null"], format: uuid }
        confirmed_at: { type: [string, "null"], format: date-time }
        last_synced_at: { type: [string, "null"], format: date-time }
        last_sync_error: { type: string, description: Vazio se a última Sincronização deu certo }
        created_at: { type: string, format: date-time }
    TeamAttachedRef:
      type: object
      required: [id, name]
      properties:
        id: { type: [string, "null"], format: uuid, description: "null enquanto a principal não estiver cadastrada" }
        name: { type: string }
    TimelineEntry:
      type: object
      required: [chamber, at, body, description, situation, dispatch]
      properties:
        chamber: { $ref: "#/components/schemas/Chamber" }
        at: { type: string, format: date-time }
        body: { type: string, description: Órgão (sigla) }
        description: { type: string }
        situation: { type: string }
        dispatch: { type: string }
    TeamProposition:
      type: object
      required: [id, slug, name, kind, number, year, sphere, origin_chamber, official_summary, presented_at, official_text_url, authors, status, superseded, attached_to, review_state, links, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: pec-221-2019 }
        name: { type: string, example: PEC 221/2019 }
        kind: { type: string }
        number: { type: integer }
        year: { type: integer }
        sphere: { type: string, enum: [federal, state, municipal] }
        origin_chamber: { type: string }
        official_summary: { type: string, description: Ementa oficial (da fonte) }
        presented_at: { type: [string, "null"], format: date-time }
        official_text_url: { type: string }
        authors: { type: array, items: { type: string } }
        status: { type: string }
        superseded: { type: boolean, description: Prejudicada }
        attached_to:
          oneOf:
            - $ref: "#/components/schemas/TeamAttachedRef"
            - type: "null"
        review_state: { $ref: "#/components/schemas/ReviewState" }
        links:
          type: array
          items: { $ref: "#/components/schemas/SourceLink" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamPropositionDetail:
      allOf:
        - $ref: "#/components/schemas/TeamProposition"
        - type: object
          required: [attached, timeline]
          properties:
            attached:
              type: array
              items: { $ref: "#/components/schemas/TeamAttachedRef" }
            timeline:
              type: array
              items: { $ref: "#/components/schemas/TimelineEntry" }
        - $ref: "#/components/schemas/TeamEditorial"
    PublicRef:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: [string, "null"], description: "null se a Proposição não é pública" }
    PublicSource:
      type: object
      required: [chamber, name, url]
      properties:
        chamber: { $ref: "#/components/schemas/Chamber" }
        name: { type: string }
        url: { type: string }
    PublicProposition:
      type: object
      description: |
        Dados oficiais e, com Versão vigente, Resumo, Resumo curto, Temas e
        Selo dela. Nada interno (estado de Revisão, conteúdo da Versão em
        análise, Autoria, quem aprovou, Posse, "a confirmar", revisão,
        quem confirmou vínculos, erros de Sincronização, sugestões).
      required: [slug, name, kind, number, year, sphere, origin_chamber, official_summary, presented_at, official_text_url, authors, status, superseded, attached_to, attached, sources, under_review, updated_at, summary, short_summary, topics, review_badge, pending_version]
      properties:
        slug: { type: string, example: pec-221-2019 }
        name: { type: string, example: PEC 221/2019 }
        kind: { type: string }
        number: { type: integer }
        year: { type: integer }
        sphere: { type: string, enum: [federal, state, municipal] }
        origin_chamber: { type: string }
        official_summary: { type: string, description: Ementa oficial (da fonte) }
        presented_at: { type: [string, "null"], format: date-time }
        official_text_url: { type: string, description: Link do Documento integral na Casa }
        authors: { type: array, items: { type: string } }
        status: { type: string, description: Situação atual oficial }
        superseded: { type: boolean, description: Prejudicada }
        attached_to:
          oneOf:
            - $ref: "#/components/schemas/PublicRef"
            - type: "null"
        attached:
          type: array
          items: { $ref: "#/components/schemas/PublicRef" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/PublicSource" }
        under_review: { type: boolean, description: "\"Em análise\" (sem Versão vigente): só dados oficiais" }
        updated_at: { type: string, format: date-time }
        summary: { type: string, description: "Resumo da Versão vigente; vazio sem ela" }
        short_summary: { type: string, description: "Resumo curto da Versão vigente; vazio sem ela" }
        topics:
          type: array
          items: { type: string }
          description: Nomes dos Temas da Versão vigente; vazio sem ela
        review_badge:
          type: [integer, "null"]
          enum: [1, 2, null]
          description: "Selo de revisão: 2 (\"revisado por 2 pessoas\") ou 1; null sem Versão vigente. Nunca nomes."
        pending_version:
          oneOf:
            - $ref: "#/components/schemas/PublicPendingVersion"
            - type: "null"
          description: Aviso "há texto novo em análise" (só com Versão vigente). Nada do conteúdo dela.
    PublicPendingVersion:
      type: object
      required: [label, official_text_url]
      properties:
        label: { type: string, example: Substitutivo da CCJ }
        official_text_url: { type: string }
    PublicPropositionDetail:
      allOf:
        - $ref: "#/components/schemas/PublicProposition"
        - type: object
          required: [timeline]
          properties:
            timeline:
              type: array
              items: { $ref: "#/components/schemas/TimelineEntry" }
    Sphere:
      type: string
      enum: [federal, state, municipal]
    PropositionVersion:
      type: object
      required: [id, seq, label, official_text_url, state, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        label: { type: string, maxLength: 120 }
        official_text_url: { type: string, description: Link do Documento integral desta Versão }
        state: { type: string, enum: [pending, current, superseded], description: "em análise, vigente, substituída" }
        created_by: { type: [string, "null"], format: uuid, description: "null quando veio da Importação" }
        created_at: { type: string, format: date-time }
    VersionContent:
      type: object
      description: Conteúdo editorial de uma Versão (só a equipe vê estes campos).
      required: [version_id, summary, short_summary, topic_ids, needs_confirmation, authors, revision, updated_by, updated_at]
      properties:
        version_id: { type: string, format: uuid }
        summary: { type: string, maxLength: 5000, description: Resumo }
        short_summary: { type: string, maxLength: 280, description: Resumo curto }
        topic_ids:
          type: array
          maxItems: 3
          items: { type: string, format: uuid }
        needs_confirmation: { type: boolean, description: Copiado da Versão anterior e ainda não confirmado }
        authors:
          type: array
          items: { type: string, format: uuid }
          description: Autoria editorial (ids; nomes em `people` no detalhe)
        revision: { type: integer, description: Trava otimista; mande de volta ao gravar }
        updated_by: { type: [string, "null"], format: uuid }
        updated_at: { type: string, format: date-time }
    CreateVersionRequest:
      type: object
      additionalProperties: false
      required: [label, official_text_url]
      properties:
        label: { type: string, maxLength: 120, example: Substitutivo da CCJ }
        official_text_url: { type: string, description: Link http(s) do Documento integral }
    UpdateContentRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        summary: { type: string, maxLength: 5000 }
        short_summary: { type: string, maxLength: 280 }
        topic_ids:
          type: array
          maxItems: 3
          items: { type: string, format: uuid }
        revision: { type: integer, description: O revision lido }
    ConfirmContentRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, description: O revision lido }
    Topic:
      type: object
      required: [id, name, active, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    Claim:
      type: object
      description: Posse (só a equipe vê).
      required: [holder_id, holder_name, claimed_at, last_activity_at, expires_at]
      properties:
        holder_id: { type: string, format: uuid }
        holder_name: { type: string }
        claimed_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: 3 dias depois da última atividade }
    TeamClaim:
      allOf:
        - $ref: "#/components/schemas/Claim"
        - type: object
          required: [mine, can_release]
          properties:
            mine: { type: boolean, description: A Posse é de quem pergunta }
            can_release: { type: boolean, description: "Quem pergunta pode soltar esta Posse (a própria, ou Revisor/Admin)" }
    ApprovalInfo:
      type: object
      required: [version_id, approved_by, approved_at, four_eyes, second_review_by, second_review_at, pending_second_review]
      properties:
        version_id: { type: string, format: uuid }
        approved_by: { type: string, format: uuid }
        approved_at: { type: string, format: date-time }
        four_eyes: { type: boolean }
        second_review_by: { type: [string, "null"], format: uuid }
        second_review_at: { type: [string, "null"], format: date-time }
        pending_second_review: { type: boolean }
    Blocker:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            `role`, `no_pending_version`, `not_in_review`, `four_eyes`,
            `summary`, `short_summary`, `topics`, `inactive_topics` ou
            `needs_confirmation`.
        message: { type: string, description: Texto para a tela }
    TeamEditorial:
      type: object
      required: [versions, pending_content, current_content, topics, claim, review_badge, current_approval, can_edit, can_create_version, can_approve, approve_blockers, approval_breaks_four_eyes, can_second_review, people]
      properties:
        versions:
          type: array
          items: { $ref: "#/components/schemas/PropositionVersion" }
        pending_content:
          oneOf:
            - $ref: "#/components/schemas/VersionContent"
            - type: "null"
        current_content:
          oneOf:
            - $ref: "#/components/schemas/VersionContent"
            - type: "null"
        topics:
          type: array
          items: { $ref: "#/components/schemas/Topic" }
          description: Todos os Temas, para mostrar nomes
        claim:
          oneOf:
            - $ref: "#/components/schemas/TeamClaim"
            - type: "null"
        review_badge: { type: [integer, "null"], enum: [1, 2, null], description: Selo da Versão vigente }
        current_approval:
          oneOf:
            - $ref: "#/components/schemas/ApprovalInfo"
            - type: "null"
        can_edit: { type: boolean, description: Pode gravar o conteúdo da Versão em análise (Posse livre ou sua) }
        can_create_version: { type: boolean }
        can_approve: { type: boolean }
        approve_blockers:
          type: array
          items: { $ref: "#/components/schemas/Blocker" }
          description: Por que quem pergunta não pode aprovar agora (vazio se pode)
        approval_breaks_four_eyes: { type: boolean, description: "Admin autor: se aprovar, fica a Segunda revisão pendente" }
        can_second_review: { type: boolean }
        people:
          type: object
          additionalProperties: { type: string }
          description: Nomes da equipe por id (Autoria, Posse, aprovação)
    Approval:
      type: object
      required: [version_id, approved_at, four_eyes, second_review_at, pending_second_review, review_badge]
      properties:
        version_id: { type: string, format: uuid }
        approved_at: { type: string, format: date-time }
        four_eyes: { type: boolean }
        second_review_at: { type: [string, "null"], format: date-time }
        pending_second_review: { type: boolean }
        review_badge: { type: integer, enum: [1, 2] }
    QueueItem:
      type: object
      required: [proposition_id, name, slug, sphere, reason, version, since, claim, missing]
      properties:
        proposition_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        sphere: { $ref: "#/components/schemas/Sphere" }
        reason: { type: string, enum: [review, second_review] }
        version:
          type: object
          required: [id, seq, label]
          properties:
            id: { type: string, format: uuid }
            seq: { type: integer }
            label: { type: string }
        since: { type: string, format: date-time, description: Desde quando está na Fila }
        claim:
          oneOf:
            - $ref: "#/components/schemas/Claim"
            - type: "null"
        missing:
          type: array
          items: { $ref: "#/components/schemas/Blocker" }
          description: O que falta no conteúdo para aprovar (itens de revisão)
