openapi: 3.1.0
info:
  title: Nelisa API
  version: 0.1.0
  description: |
    Contrato da API do Nelisa. Quem muda um endpoint muda este arquivo no
    mesmo PR; o cliente TypeScript do web/ é gerado a partir dele.
    Rotas públicas em /api/public (filtradas pela regra de visibilidade);
    rotas da equipe em /api/team (sempre autenticadas, exceto
    /api/team/auth).

    Sessão: o login devolve um token de acesso (JWT, 15 min) no corpo, para
    o header `Authorization: Bearer`, e o refresh token no cookie
    `nelisa_refresh` (HttpOnly; Secure; SameSite=Strict;
    Path=/api/team/auth). O front guarda o token de acesso só em memória e
    chama /api/team/auth/refresh quando ele expira. Sem CORS: o Next faz
    proxy de /api na mesma origem.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: sistema
  - name: sessão
  - name: conta
  - name: equipe
  - name: fontes
  - name: proposições
  - name: ciclo editorial
  - name: correção e errata
  - name: fila
  - name: público
  - name: contribuições
paths:
  /version:
    get:
      tags: [sistema]
      summary: Versão do binário em execução
      security: []
      responses:
        "200":
          description: Versão
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
  /healthz:
    get:
      tags: [sistema]
      summary: Saúde da API e do banco
      security: []
      responses:
        "200": { description: Saudável }
        "503":
          description: Banco indisponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/team/auth/bootstrap:
    post:
      tags: [sessão]
      summary: Cria a primeira pessoa da equipe, como Admin
      description: |
        Só funciona com `BOOTSTRAP_TOKEN` configurado no servidor e enquanto
        não houver nenhum usuário. Limite de 10 requisições por minuto por
        IP (compartilhado com o login).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapRequest" }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: "`bootstrap_disabled` (sem BOOTSTRAP_TOKEN) ou `bootstrap_token_invalid`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`already_bootstrapped`: já existe usuário"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/team/auth/login:
    post:
      tags: [sessão]
      summary: Entra com e-mail e senha
      description: Limite de 10 requisições por minuto por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_credentials`: e-mail ou senha incorretos (não diz qual)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`account_deactivated`: senha certa, mas a conta foi desativada"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/team/auth/refresh:
    post:
      tags: [sessão]
      summary: Troca o refresh token do cookie por uma sessão nova
      description: |
        O refresh token gira a cada uso (o cookie é substituído). Um token já
        usado que volta depois de 30 s encerra todas as sessões da pessoa.
        Limite de 30 requisições por minuto por IP.
      security:
        - refreshCookie: []
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401":
          description: "`invalid_refresh_token`: cookie ausente, desconhecido, expirado ou reusado; o cookie é apagado"
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/team/auth/logout:
    post:
      tags: [sessão]
      summary: Encerra a sessão do cookie
      description: Idempotente; sem cookie também responde 204.
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Sessão apagada e cookie limpo
          headers:
            Set-Cookie:
              schema: { type: string }

  /api/team/me:
    get:
      tags: [conta]
      summary: Dados da pessoa logada
      responses:
        "200":
          description: Usuário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/team/me/password:
    post:
      tags: [conta]
      summary: Troca a própria senha
      description: |
        Exige a senha atual. Encerra todas as sessões da pessoa, inclusive a
        atual, e devolve uma sessão nova (token de acesso e cookie).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`wrong_password`: a senha atual não confere"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`credentials_changed`: a senha mudou nesse meio-tempo"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/team/users:
    get:
      tags: [equipe]
      summary: Lista a equipe (só Admin)
      responses:
        "200":
          description: Usuários, do cadastro mais antigo ao mais novo
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [equipe]
      summary: Cadastra uma pessoa (só Admin)
      description: |
        Sem convite nem e-mail (ADR 0001): o Admin define a senha inicial,
        que é temporária (`must_change_password: true`). Registrado na
        Auditoria (`user.create`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`email_taken`: e-mail já cadastrado (sem diferenciar maiúsculas)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    patch:
      tags: [equipe]
      summary: Troca a role de alguém (só Admin)
      description: |
        Nunca deixa o Nelisa sem Admin. Vale na próxima requisição da
        pessoa. Registrado na Auditoria (`user.role_change`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleRequest" }
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409":
          description: "`last_admin`: rebaixaria o último Admin"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/users/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [equipe]
      summary: Desativa alguém (só Admin)
      description: |
        Ninguém é excluído: a conta fica, porque Auditoria, Autoria e
        aprovações apontam para ela. O login passa a ser recusado
        (`account_deactivated`) e todas as sessões acabam na hora.
        Desativar quem já está desativado não muda nada. Registrado na
        Auditoria (`user.deactivate`).
      responses:
        "200":
          description: Usuário desativado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409":
          description: "`cannot_deactivate_self` ou `last_admin` (último Admin ativo)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/users/{id}/reactivate:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [equipe]
      summary: Reativa alguém (só Admin)
      description: |
        A pessoa volta a entrar com a senha que tinha; sessões de antes da
        desativação seguem encerradas. Registrado na Auditoria
        (`user.reactivate`).
      responses:
        "200":
          description: Usuário ativo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
  /api/team/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [equipe]
      summary: Reseta a senha de alguém (só Admin)
      description: |
        A nova senha é temporária e todas as sessões da pessoa acabam.
        Registrado na Auditoria (`user.password_reset`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Senha trocada }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409":
          description: "`credentials_changed`: a senha mudou nesse meio-tempo"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/team/sources/search:
    get:
      tags: [fontes]
      summary: Busca uma Proposição pelo nome oficial nas Casas com API (Editor ou acima)
      description: |
        Consulta todas as fontes configuradas (Câmara e Senado) por Tipo,
        número e ano. Uma Casa fora do ar vem com `unavailable: true` e as
        outras seguem. Cada registro diz se já está ligado a uma Proposição
        (`link_state`: `confirmed` ou `suggested`).
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, example: PEC } }
        - { name: number, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: year, in: query, required: true, schema: { type: integer, minimum: 1800 } }
      responses:
        "200":
          description: Resultado por Casa
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/SourceSearchResult" }
        "400":
          description: "`invalid_query`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/team/radar:
    get:
      tags: [fontes]
      summary: Radar de PL, PEC e PLP em pauta ou recém-apresentadas (Editor ou acima)
      description: |
        Uma rodada por dia (6h de Brasília) lê nas duas Casas a pauta do
        Plenário de hoje até 7 dias à frente e as apresentadas nos últimos 3
        dias. Aqui só aparece o que ainda não está no Nelisa (nem como
        Vínculo sugerido) e não foi dispensado: primeiro a pauta, da sessão
        mais próxima; depois as apresentadas, das mais novas. Importar usa
        `POST /api/team/propositions/import` com `chamber` e `external_id`.
      responses:
        "200":
          description: Itens do Radar
          content:
            application/json:
              schema:
                type: object
                required: [items, last_scan_at]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RadarItem" }
                  last_scan_at:
                    description: Quando uma rodada achou algo pela última vez (null se nunca)
                    type: [string, "null"]
                    format: date-time
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/team/radar/scan:
    post:
      tags: [fontes]
      summary: Pede uma rodada do Radar agora (Editor ou acima)
      description: Enfileira a rodada no worker; uma rodada já na fila não ganha outra.
      responses:
        "202": { description: Rodada enfileirada }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/team/radar/{chamber}/{externalId}/dismiss:
    parameters:
      - name: chamber
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Chamber" }
      - name: externalId
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9]{1,15}$" }
    post:
      tags: [fontes]
      summary: Dispensa um item do Radar (Editor ou acima)
      description: |
        Some da lista até entrar numa pauta do Plenário posterior à que tinha
        ao ser dispensado. Auditado (`radar.dismiss`).
      responses:
        "204": { description: Dispensado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`radar_item_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/import:
    post:
      tags: [fontes]
      summary: Importa uma Proposição de uma Casa (Editor ou acima)
      description: |
        Busca o registro e a Tramitação na Casa escolhida e cria a
        Proposição em `draft`, com o Vínculo de fonte dessa Casa confirmado
        (escolher o registro é confirmar). Procura a mesma Proposição nas
        outras Casas e grava o que achar como Vínculo **sugerido**: nada é
        confirmado sozinho. Falha na Casa escolhida não grava nada (503);
        falha só na procura de candidatos não impede a Importação e aparece
        em `suggestions_unavailable`. Importar de novo um registro já
        vinculado devolve 200 com a Proposição existente. Registrado na
        Auditoria (`proposition.import`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: O registro já estava vinculado; nada foi criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "201":
          description: Proposição criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400":
          description: "`invalid_json`, `unknown_chamber` ou `invalid_external_id`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`source_record_not_found`: a Casa não tem esse registro"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `already_suggested` (o registro é sugestão de Vínculo de uma
            Proposição: confirme lá), `proposition_exists` (mesma Casa
            iniciadora, Tipo, número e ano, ligada a outro registro) ou
            `link_taken`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`source_unavailable`: a fonte oficial falhou; nada foi gravado"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions:
    get:
      tags: [proposições]
      summary: Lista as Proposições para a equipe (Editor ou acima)
      description: Todas, em qualquer estado de Revisão, com Vínculos de fonte e a última Sincronização de cada um.
      responses:
        "200":
          description: Proposições, da atualizada mais recentemente para a mais antiga
          content:
            application/json:
              schema:
                type: object
                required: [propositions]
                properties:
                  propositions:
                    type: array
                    items: { $ref: "#/components/schemas/TeamProposition" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/team/propositions/{id}:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
    get:
      tags: [proposições]
      summary: Uma Proposição como a equipe a vê (Editor ou acima)
      description: |
        Traz também o ciclo editorial: Versões, conteúdo da Versão em
        análise e da vigente, Posse, Selo, aprovação da vigente e as
        decisões de permissão para quem pergunta (`can_edit`,
        `can_create_version`, `can_approve` com `approve_blockers`,
        `approval_breaks_four_eyes`, `can_second_review`). O front não
        decide: mostra o que a API diz.
      responses:
        "200":
          description: Proposição com Vínculos, Apensação, Tramitação e ciclo editorial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamPropositionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PropositionNotFound" }
  /api/team/propositions/{id}/submit-for-review:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
    post:
      tags: [proposições]
      summary: Envia para revisão (criado → em revisão) (Editor ou acima)
      description: |
        A partir daqui a parte pública mostra a Proposição "em análise", só
        com dados oficiais. Registrado na Auditoria
        (`proposition.submit_for_review`). Marcar como pronto é da fase 2.
      responses:
        "200":
          description: Novo estado
          content:
            application/json:
              schema:
                type: object
                required: [id, review_state]
                properties:
                  id: { type: string, format: uuid }
                  review_state: { $ref: "#/components/schemas/ReviewState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PropositionNotFound" }
        "409":
          description: "`invalid_review_transition`: a Proposição não está em `draft`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/links/{linkId}/confirm:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/LinkID"
    post:
      tags: [proposições]
      summary: Confirma um Vínculo de fonte sugerido (Editor ou acima)
      description: |
        Só o Editor confirma (ADR 0006). A Sincronização do Vínculo é
        enfileirada na mesma transação. Registrado na Auditoria
        (`source_link.confirm`).
      responses:
        "200":
          description: Vínculo confirmado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/LinkNotFound" }
        "409":
          description: |
            `link_not_suggested` (já confirmado), `link_taken` (o registro
            já está confirmado em outra Proposição) ou
            `chamber_already_linked` (a Proposição já tem Vínculo confirmado
            nessa Casa).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/links/{linkId}/reject:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/LinkID"
    post:
      tags: [proposições]
      summary: Descarta um Vínculo de fonte sugerido (Editor ou acima)
      description: Registrado na Auditoria (`source_link.reject`).
      responses:
        "204": { description: Descartado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/LinkNotFound" }
        "409":
          description: "`link_not_suggested`: vínculo confirmado não se descarta"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/team/propositions/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
    post:
      tags: [ciclo editorial]
      summary: Registra uma Versão nova do Documento integral (Editor ou acima)
      description: |
        Só sem Versão em análise. A Proposição pronta volta para
        `in_review`; o conteúdo da Versão vigente é copiado para a nova
        marcado a confirmar (`needs_confirmation`), com a mesma Autoria.
        Quem registra assume a Posse (409 `claim_taken` se ela é de outra
        pessoa). Registrado na Auditoria (`version.create`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVersionRequest" }
      responses:
        "201":
          description: Versão criada (em análise) e o conteúdo dela
          content:
            application/json:
              schema:
                type: object
                required: [version, content]
                properties:
                  version: { $ref: "#/components/schemas/PropositionVersion" }
                  content: { $ref: "#/components/schemas/VersionContent" }
        "400":
          description: "`invalid_json`, `invalid_label` ou `invalid_official_text_url`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PropositionNotFound" }
        "409":
          description: "`pending_version_exists` ou `claim_taken` (a mensagem traz o nome de quem tem a Posse)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/content:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    put:
      tags: [ciclo editorial]
      summary: Grava Resumo, Resumo curto e Temas da Versão em análise (Editor ou acima)
      description: |
        Só a Versão em análise é editável. Exige a Posse: se está livre
        (ou expirada, ou de conta desativada) é assumida; se é de outra
        pessoa, 409 `claim_taken`. Trava otimista: mande o `revision` lido;
        se alguém gravou depois, 409 `stale_content` e nada muda. Quem grava
        entra na Autoria (`authors`). Salvar não confirma conteúdo trazido.
        Gravação sem mudança só renova a atividade da Posse. Registrado na
        Auditoria (`content.update`, com os campos alterados, nunca o texto).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContentRequest" }
      responses:
        "200":
          description: Conteúdo gravado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionContent" }
        "400":
          description: |
            `invalid_json` (inclusive sem `revision`), `summary_too_long`,
            `short_summary_too_long`, `too_many_topics`, `duplicate_topic` ou
            `topic_inactive` (Tema desativado só fica se já estava escolhido).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found`, `version_not_found` ou `topic_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`claim_taken`, `stale_content` ou `version_not_editable` (Versão vigente ou substituída)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/content/confirm:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    post:
      tags: [ciclo editorial]
      summary: Confirma o conteúdo trazido da Versão anterior (Editor ou acima)
      description: |
        Ação explícita, separada de gravar. Exige a Posse como gravar e o
        `revision` lido (confirma-se o que se viu). Quem confirma entra na
        Autoria. Registrado na Auditoria (`content.confirm`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmContentRequest" }
      responses:
        "200":
          description: Conteúdo confirmado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionContent" }
        "400":
          description: "`invalid_json`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found` ou `version_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`claim_taken`, `stale_content`, `version_not_editable` ou `nothing_to_confirm`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/structuring:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    put:
      tags: [ciclo editorial]
      summary: Corrige ou cola o texto da Versão e refaz os Dispositivos (Editor ou acima)
      description: |
        Só na Versão em análise. Exige a Posse (assume se livre) e o
        `revision` lido da Estruturação. Volta a "a conferir" mesmo se
        estava confirmada. Quem grava entra na Autoria do conteúdo (quatro
        olhos). Registrado na Auditoria (`structuring.reprocess`, sem o
        texto).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReprocessStructuringRequest" }
      responses:
        "200":
          description: Estruturação refeita
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamStructuring" }
        "400":
          description: "`invalid_json` (inclusive sem `revision`) ou `invalid_source_text` (vazio ou mais de 500 mil caracteres)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found`, `version_not_found` ou `structuring_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`claim_taken`, `stale_content`, `version_not_editable` ou `anchors_removed` (o texto novo apaga Dispositivos que têm Comentário)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/structuring/confirm:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    post:
      tags: [ciclo editorial]
      summary: Confirma os Dispositivos da Versão em análise (Editor ou acima)
      description: |
        Libera os Comentários e tira o bloqueio `structuring_pending` da
        aprovação. Exige a Posse e o `revision` lido. Quem confirma entra na
        Autoria. Auditoria `structuring.confirm`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmContentRequest" }
      responses:
        "200":
          description: Estruturação confirmada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamStructuring" }
        "400":
          description: "`invalid_json`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found`, `version_not_found` ou `structuring_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`claim_taken`, `stale_content`, `version_not_editable` ou `structuring_not_ready`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/structuring/retry:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    post:
      tags: [ciclo editorial]
      summary: Busca de novo o PDF oficial (Editor ou acima)
      description: |
        Só numa Estruturação manual cuja busca falhou e cujo link é de Fonte
        oficial com API. Exige a Posse; não entra na Autoria. Auditoria
        `structuring.retry`.
      responses:
        "200":
          description: Busca enfileirada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamStructuring" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found`, `version_not_found` ou `structuring_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`claim_taken`, `version_not_editable` ou `structuring_cannot_retry`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/comments:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    post:
      tags: [ciclo editorial]
      summary: Comenta um Dispositivo da Versão em análise (Editor ou acima)
      description: |
        Só depois de confirmada a Estruturação. Exige a Posse (assume se
        livre). Quem comenta entra na Autoria do Comentário e do conteúdo
        (quatro olhos). Auditoria `comment.create` (sem o texto).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        "201":
          description: Comentário criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamComment" }
        "400":
          description: "`invalid_json`, `invalid_comment` (vazio ou mais de 3.000 caracteres), `provision_not_found` ou `provision_not_commentable` (Capítulo, Seção)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found`, `version_not_found` ou `structuring_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`claim_taken`, `version_not_editable` ou `structuring_not_confirmed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [ciclo editorial]
      summary: Edita um Comentário (Editor ou acima)
      description: Exige a Posse e o `revision` lido. Editar um Comentário trazido não o confirma. Auditoria `comment.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCommentRequest" }
      responses:
        "200":
          description: Comentário gravado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamComment" }
        "400":
          description: "`invalid_json` ou `invalid_comment`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found`, `version_not_found` ou `comment_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`claim_taken`, `stale_content` ou `version_not_editable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [ciclo editorial]
      summary: Apaga um Comentário (Editor ou acima)
      description: Soft delete. Exige a Posse e o `revision` lido. Auditoria `comment.delete`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmContentRequest" }
      responses:
        "200":
          description: Comentário apagado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamComment" }
        "400":
          description: "`invalid_json`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found`, `version_not_found` ou `comment_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`claim_taken`, `stale_content` ou `version_not_editable`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/comments/{commentId}/confirm:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [ciclo editorial]
      summary: Confirma um Comentário trazido da Versão anterior (Editor ou acima)
      description: Exige a Posse e o `revision` lido; quem confirma entra na Autoria. Auditoria `comment.confirm`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmContentRequest" }
      responses:
        "200":
          description: Comentário confirmado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamComment" }
        "400":
          description: "`invalid_json`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found`, `version_not_found` ou `comment_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`claim_taken`, `stale_content`, `version_not_editable` ou `nothing_to_confirm`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/approve:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    post:
      tags: [ciclo editorial]
      summary: Aprova (marca como pronta) a Versão em análise (Revisor ou Admin)
      description: |
        Não exige Posse. A Proposição precisa estar `in_review` e o
        conteúdo completo (Resumo e Resumo curto, 1 a 3 Temas ativos, nada a
        confirmar). Quatro olhos: quem está na Autoria não aprova (403
        `four_eyes`), exceto o Admin, que aprova sem quatro olhos
        (`four_eyes: false`, Selo 1, Segunda revisão pendente). Na mesma
        transação: a Versão vira a vigente, a anterior é substituída, a
        Proposição fica `ready`, a Posse é solta e a Auditoria registra
        (`review.approve`). Falha em qualquer passo desfaz tudo.

        O corpo leva a `revision` do conteúdo que o Revisor leu: se alguém
        gravou depois, a aprovação é recusada (409 `stale_content`), para
        ninguém aprovar texto que não viu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: { type: integer, description: "revision do conteúdo em análise que quem aprova leu" }
      responses:
        "200":
          description: Aprovada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (Editor) ou `four_eyes`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`proposition_not_found` ou `version_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `content_incomplete` (a mensagem lista o que falta),
            `stale_content` (o conteúdo mudou desde a leitura),
            `version_not_pending` ou `invalid_review_transition` (rascunho).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/second-review:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    post:
      tags: [ciclo editorial]
      summary: Confirma a segunda revisão de uma aprovação sem quatro olhos (Revisor ou Admin)
      description: |
        Só para a Versão vigente aprovada sem quatro olhos. Quem aprovou e
        quem está na Autoria não fazem a segunda (403 `four_eyes`). O Selo
        passa a 2. Registrado na Auditoria (`review.second_review`).
      responses:
        "200":
          description: Segunda revisão registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (Editor) ou `four_eyes`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`proposition_not_found` ou `version_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`no_second_review_pending`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/minor-fix:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    put:
      tags: [correção e errata]
      summary: Aplica uma Correção menor ao conteúdo da Versão vigente (Editor ou acima)
      description: |
        Correção que não muda o sentido (digitação, formatação, link). Só na
        Versão vigente de uma Proposição pronta. Exige a Posse (assume se
        livre; 409 `claim_taken` se de outra pessoa), o `revision` lido
        (409 `stale_content`) e nenhuma Errata pendente na Versão (409
        `erratum_pending`). Mesmas validações do conteúdo, e o conteúdo
        publicado não pode ficar sem Resumo, Resumo curto ou Temas. Entra na
        hora: a Proposição segue pronta e o Leitor vê o texto corrigido sem
        aviso; quem corrigiu entra na Autoria; a correção fica "a conferir"
        na Fila (`minor_fix_check`). Auditoria `content.minor_fix` (Versão,
        campos; nunca o texto), na mesma transação.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateContentRequest" }
      responses:
        "200":
          description: Correção aplicada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MinorFix" }
        "400":
          description: |
            `revision_required`, `summary_too_long`, `short_summary_too_long`,
            `too_many_topics`, `duplicate_topic`, `topic_not_found`,
            `topic_inactive` ou `published_content_incomplete`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found` ou `version_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `claim_taken`, `stale_content`, `erratum_pending`, `no_changes`
            (o texto é igual ao publicado), `version_not_current` (Versão em
            análise ou substituída) ou `not_ready` (Proposição não pronta).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/minor-fixes/{fixId}/check:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - name: fixId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [correção e errata]
      summary: Confere uma Correção menor (Revisor ou Admin que não a fez)
      description: |
        Tira a correção da Fila. Quem a fez não confere (403 `four_eyes`),
        nem o Admin. Não há "rejeitar": quem discorda faz outra Correção
        menor ou propõe uma Errata. Auditoria `review.minor_fix_check`.
      responses:
        "200":
          description: Conferida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MinorFix" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (Editor) ou `four_eyes`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`minor_fix_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`minor_fix_checked`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/errata:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
    post:
      tags: [correção e errata]
      summary: Propõe uma Errata para a Versão vigente (Editor ou acima)
      description: |
        Correção que muda o sentido. Leva o conteúdo completo como fica
        depois da Errata (mesmas validações do conteúdo) e a nota pública
        (`said`, `correct`). Não exige Posse. No máximo uma pendente por
        Versão (409 `erratum_pending`). Enquanto pendente nada muda para o
        Leitor. Auditoria `review.erratum_propose`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposeErratumRequest" }
      responses:
        "201":
          description: Errata proposta (pendente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erratum" }
        "400":
          description: |
            `revision_required`, `invalid_erratum_note` e as mesmas do
            conteúdo da Correção menor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`proposition_not_found` ou `version_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`erratum_pending`, `stale_content`, `no_changes`, `version_not_current` ou `not_ready`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/errata/{erratumId}/approve:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
      - $ref: "#/components/parameters/ErratumID"
    post:
      tags: [correção e errata]
      summary: Aprova a Errata (Revisor ou Admin que não a propôs)
      description: |
        Quatro olhos sem exceção: quem propôs não aprova, nem o Admin (403
        `four_eyes`). O corpo leva a `revision` do conteúdo vigente que quem
        aprova leu; ela e a atual têm de ser a de quando a Errata foi
        proposta (`base_revision`), senão 409 `stale_content` e a Errata
        precisa ser refeita. Na mesma transação: o conteúdo vigente vira o
        da Errata (revision sobe, quem propôs entra na Autoria), a Errata
        fica `approved` e a Auditoria registra (`review.erratum_approve`).
        A nota passa a aparecer na página pública.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: { type: integer, description: revision do conteúdo vigente que quem aprova leu }
      responses:
        "200":
          description: Aprovada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erratum" }
        "400":
          description: "`revision_required` ou as do conteúdo (um Tema escolhido foi desativado no meio do caminho)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (Editor) ou `four_eyes`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`proposition_not_found`, `version_not_found` ou `erratum_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`stale_content`, `erratum_not_pending`, `version_not_current` ou `not_ready`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/errata/{erratumId}/reject:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
      - $ref: "#/components/parameters/ErratumID"
    post:
      tags: [correção e errata]
      summary: Recusa a Errata com motivo interno (Revisor ou Admin que não a propôs)
      description: |
        Nada muda no conteúdo; o motivo fica só para a equipe. Auditoria
        `review.erratum_reject`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Recusada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erratum" }
        "400":
          description: "`invalid_reason`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (Editor) ou `four_eyes`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`erratum_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`erratum_not_pending`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/versions/{versionId}/errata/{erratumId}/withdraw:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
      - $ref: "#/components/parameters/VersionID"
      - $ref: "#/components/parameters/ErratumID"
    post:
      tags: [correção e errata]
      summary: Retira a Errata pendente (só quem a propôs)
      description: Nada muda no conteúdo. Auditoria `review.erratum_withdraw`.
      responses:
        "200":
          description: Retirada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erratum" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (não é quem propôs)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`erratum_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`erratum_not_pending`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/propositions/{id}/claim:
    parameters:
      - $ref: "#/components/parameters/PropositionID"
    post:
      tags: [fila]
      summary: Assume a Posse da Proposição (Editor ou acima)
      description: |
        Se outra pessoa tem a Posse e ela vale, 409 `claim_taken` com o nome
        dela na mensagem. A Posse expira com 3 dias sem atividade; Posse de
        conta desativada vale como livre. Assumir a própria só renova.
      responses:
        "200":
          description: Posse assumida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Claim" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/PropositionNotFound" }
        "409":
          description: "`claim_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [fila]
      summary: Solta a Posse (quem a tem, ou Revisor/Admin)
      description: |
        Revisor e Admin soltam a Posse de qualquer um; isso fica na
        Auditoria (`claim.release`). Sem Posse, não faz nada.
      responses:
        "204": { description: Solta (ou já estava livre) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/team/queue:
    get:
      tags: [fila]
      summary: Fila de revisão (Editor ou acima)
      description: |
        Proposições `in_review` com Versão em análise (`reason: review`),
        Proposições `ready` com Segunda revisão pendente
        (`reason: second_review`), com Correção menor a conferir
        (`reason: minor_fix_check`, um item por Proposição, desde a mais
        antiga) e com Errata pendente (`reason: erratum`); estes três só
        da Versão vigente; e Contribuições pendentes (`reason:
        contribution`, sem Posse nem Versão). Ordem: Esfera (federal > estadual >
        municipal), depois votação mais próxima (ainda sem dado: todas "sem
        votação"), depois mais antigo na fila primeiro.
      parameters:
        - name: sphere
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Sphere" }
      responses:
        "200":
          description: Itens da Fila
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/QueueItem" }
        "400":
          description: "`invalid_sphere`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/team/topics:
    get:
      tags: [ciclo editorial]
      summary: Lista os Temas, ativos e desativados (Editor ou acima)
      description: Desativados não devem ser oferecidos na escolha; continuam nas Versões que já os usam.
      responses:
        "200":
          description: Temas por nome
          content:
            application/json:
              schema:
                type: object
                required: [topics]
                properties:
                  topics:
                    type: array
                    items: { $ref: "#/components/schemas/Topic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [ciclo editorial]
      summary: Cria um Tema (só Admin)
      description: Registrado na Auditoria (`topic.create`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        "201":
          description: Tema criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        "400":
          description: "`invalid_json` ou `invalid_topic_name`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`topic_name_taken` (sem diferenciar maiúsculas)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/topics/{topicId}:
    parameters:
      - name: topicId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [ciclo editorial]
      summary: Renomeia, desativa ou reativa um Tema (só Admin)
      description: Registrado na Auditoria (`topic.rename`, `topic.deactivate`, `topic.reactivate`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 60 }
                active: { type: boolean }
      responses:
        "200":
          description: Tema atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        "400":
          description: "`invalid_json` ou `invalid_topic_name`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`topic_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`topic_name_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/public/propositions:
    get:
      tags: [público]
      summary: Proposições visíveis ao Leitor
      description: |
        Só `in_review` e `ready`. Rascunhos nunca aparecem. Sem Versão
        vigente aparece como "em análise" (`under_review: true`), só com
        dados oficiais; com vigente, ganha Resumo, Resumo curto, Temas e
        Selo dela, e o aviso de texto novo em análise se houver.
      security: []
      responses:
        "200":
          description: Proposições públicas
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
          content:
            application/json:
              schema:
                type: object
                required: [propositions]
                properties:
                  propositions:
                    type: array
                    items: { $ref: "#/components/schemas/PublicProposition" }
  /api/public/propositions/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: Identificador público estável ("pec-221-2019")
        schema: { type: string, example: pec-221-2019 }
    get:
      tags: [público]
      summary: Página pública de uma Proposição
      description: Rascunho ou inexistente respondem 404 igual, sem revelar que existe.
      security: []
      responses:
        "200":
          description: Proposição com Tramitação
          headers:
            Cache-Control: { schema: { type: string, example: "public, max-age=60" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPropositionDetail" }
        "404": { $ref: "#/components/responses/PropositionNotFound" }

  /api/team/official-sources:
    get:
      tags: [contribuições]
      summary: Lista os domínios cadastrados como Fonte oficial (Editor ou acima)
      description: "`default_suffixes` são aceitos sem cadastro (`.leg.br`, `.gov.br`)."
      responses:
        "200":
          description: Fontes oficiais por domínio
          content:
            application/json:
              schema:
                type: object
                required: [items, default_suffixes]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OfficialSource" }
                  default_suffixes:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [contribuições]
      summary: Cadastra um domínio como Fonte oficial (Editor ou Revisor)
      description: |
        O host de um link vale como Fonte oficial se for o domínio ou um
        subdomínio dele. Registrado na Auditoria (`official_source.create`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain, name, sphere]
              properties:
                domain: { type: string, example: camara.exemplo.org }
                name: { type: string, maxLength: 200 }
                sphere: { $ref: "#/components/schemas/Sphere" }
      responses:
        "201":
          description: Fonte oficial cadastrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfficialSource" }
        "400":
          description: "`invalid_json`, `invalid_domain`, `invalid_source_name` ou `invalid_sphere`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`official_source_exists`: já cadastrado ou já coberto (.leg.br, .gov.br ou domínio acima)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/official-sources/{sourceId}:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [contribuições]
      summary: Remove uma Fonte oficial (só Admin)
      description: Registrado na Auditoria (`official_source.delete`).
      responses:
        "204": { description: Removida }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`official_source_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/team/contributions/{contributionId}:
    parameters:
      - $ref: "#/components/parameters/ContributionID"
    get:
      tags: [contribuições]
      summary: Abre uma Contribuição para moderar (Editor ou acima)
      description: |
        As pendentes aparecem na Fila (`GET /api/team/queue`, `reason:
        contribution`). O texto do Leitor vem como ele mandou: a tela o
        mostra como texto puro, e o Nelisa nunca abre o link.
      responses:
        "200":
          description: A Contribuição
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamContribution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`contribution_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/contributions/{contributionId}/accept:
    parameters:
      - $ref: "#/components/parameters/ContributionID"
    post:
      tags: [contribuições]
      summary: Aceita uma Contribuição pendente (Editor ou acima)
      description: |
        Sem quatro olhos (a Contribuição não publica conteúdo editorial),
        mas auditado (`contribution.accept`). Conforme o tipo:
        - `progress_update`: `event` é obrigatório, revisado pela equipe;
          grava um evento **manual** na Tramitação da Proposição, com o
          link de fonte. A data vira meio-dia de Brasília.
        - `source_request`: cadastra o domínio como Fonte oficial, com a
          Esfera atual (também auditado como `official_source.create`).
        - `indication`: só marca aceita; a equipe importa a Proposição e
          depois aponta a criada (`PUT .../proposition`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                internal_note: { type: string, maxLength: 1000, description: Nunca pública }
                event:
                  type: object
                  additionalProperties: false
                  required: [chamber, date, description, source_url]
                  properties:
                    chamber: { $ref: "#/components/schemas/Chamber" }
                    date: { type: string, format: date, description: "AAAA-MM-DD, até um ano à frente" }
                    description: { type: string, maxLength: 1000 }
                    source_url: { type: string, maxLength: 2000, description: "https, host DNS" }
      responses:
        "200":
          description: A Contribuição depois da mudança
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamContribution" }
        "400":
          description: "`invalid_json`, `event_required`, `invalid_chamber`, `invalid_event_date`, `invalid_event_text`, `invalid_link` ou `internal_note_too_long`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`contribution_not_found` ou `proposition_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`contribution_decided`, `progress_entry_exists` ou `official_source_exists` (rejeite como `already_registered`)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/contributions/{contributionId}/reject:
    parameters:
      - $ref: "#/components/parameters/ContributionID"
    post:
      tags: [contribuições]
      summary: Rejeita uma Contribuição pendente (Editor ou acima)
      description: |
        O motivo é público (o Leitor o vê ao consultar o código); a nota
        interna nunca é. Auditado (`contribution.reject`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { $ref: "#/components/schemas/RejectReason" }
                internal_note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: A Contribuição depois da mudança
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamContribution" }
        "400":
          description: "`invalid_json`, `invalid_reason` ou `internal_note_too_long`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`contribution_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`contribution_decided`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/contributions/{contributionId}/sphere:
    parameters:
      - $ref: "#/components/parameters/ContributionID"
    put:
      tags: [contribuições]
      summary: Corrige a Esfera de uma Indicação ou Pedido de fonte oficial pendente
      description: |
        A Esfera manda na ordem da Fila. A Atualização de tramitação herda
        a da Proposição e não se corrige. Auditado
        (`contribution.sphere_change`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sphere]
              properties:
                sphere: { $ref: "#/components/schemas/Sphere" }
      responses:
        "200":
          description: A Contribuição depois da mudança
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamContribution" }
        "400":
          description: "`invalid_json`, `invalid_sphere` ou `sphere_fixed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`contribution_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`contribution_decided`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/contributions/{contributionId}/proposition:
    parameters:
      - $ref: "#/components/parameters/ContributionID"
    put:
      tags: [contribuições]
      summary: Aponta a Proposição criada a partir de uma Indicação aceita
      description: |
        Uma vez só. A consulta do Leitor passa a mostrar o link quando a
        Proposição for pública. Auditado (`contribution.link_proposition`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposition_id]
              properties:
                proposition_id: { type: string, format: uuid }
      responses:
        "200":
          description: A Contribuição depois da mudança
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamContribution" }
        "400":
          description: "`invalid_json`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`contribution_not_found` ou `proposition_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`not_linkable`: não é Indicação aceita, ou já aponta uma Proposição"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/team/contributions/{contributionId}/progress-entry:
    parameters:
      - $ref: "#/components/parameters/ContributionID"
    delete:
      tags: [contribuições]
      summary: Apaga o evento manual de uma Atualização de tramitação aceita
      description: |
        Por exemplo, quando a Sincronização já trouxe o evento oficial. A
        Contribuição continua aceita. Auditado
        (`contribution.progress_entry_delete`).
      responses:
        "204": { description: Apagado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`contribution_not_found` ou `progress_entry_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/public/contributions/availability:
    get:
      tags: [contribuições]
      summary: Diz se o formulário de Contribuição está aberto
      security: []
      responses:
        "200":
          description: Disponibilidade
          headers:
            Cache-Control: { schema: { type: string, example: no-store } }
          content:
            application/json:
              schema:
                type: object
                required: [open, reason]
                properties:
                  open: { type: boolean }
                  reason:
                    description: "`disabled` quando o envio está desligado; null se aberto"
                    type: [string, "null"]
                    enum: [disabled, null]
  /api/public/contributions:
    post:
      tags: [contribuições]
      summary: Leitor manda uma Contribuição (sem login)
      description: |
        Só existe com `CONTRIBUTIONS_ENABLED=true` (senão 404). Os campos
        usados dependem de `kind`:
        - `indication`: `link` (de Fonte oficial), `sphere`, `note`;
        - `progress_update`: `proposition_slug` (Proposição pública),
          `event_type`, `event_date`, `link` (fonte), `note`;
        - `source_request`: `domain`, `link` (evidência), `source_name`,
          `sphere`, `note`.

        O Nelisa nunca abre os links. Nada além do formulário é guardado; o
        código de acompanhamento volta só nesta resposta (o banco guarda o
        hash). Limite de 5 envios por hora por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { $ref: "#/components/schemas/ContributionKind" }
                link: { type: string, maxLength: 2000, description: "https, host DNS, sem usuário nem porta" }
                sphere: { $ref: "#/components/schemas/Sphere" }
                proposition_slug: { type: string }
                event_type: { $ref: "#/components/schemas/ProgressEventType" }
                event_date: { type: string, format: date }
                domain: { type: string }
                source_name: { type: string, maxLength: 200 }
                note: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Contribuição recebida, pendente
          content:
            application/json:
              schema:
                type: object
                required: [tracking_code]
                properties:
                  tracking_code: { type: string, example: K7Q4-9MZD-2HXP }
        "400":
          description: |
            `invalid_json`, `invalid_kind`, `invalid_link`, `invalid_domain`,
            `not_official_source`, `invalid_source_name`, `invalid_sphere`,
            `invalid_event_type`, `invalid_event_date` ou `note_too_long`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/PropositionNotFound" }
        "409":
          description: "`official_source_exists` (Pedido de fonte de domínio que já é oficial)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/public/contributions/lookup:
    post:
      tags: [contribuições]
      summary: Consulta uma Contribuição pelo código de acompanhamento
      description: |
        O código vai no corpo, não na URL, para não ficar em log nem em
        referer. Aceita minúsculas e sem hífen. Devolve só tipo, estado,
        datas, motivo público (se rejeitada) e a Proposição (se pública);
        nunca o texto enviado nem quem decidiu. Limite de 30 por hora por IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Situação da Contribuição
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContributionStatus" }
        "400":
          description: "`invalid_json`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`contribution_not_found` (também para código malformado)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acesso devolvido por login, bootstrap, refresh ou troca de senha.
    refreshCookie:
      type: apiKey
      in: cookie
      name: nelisa_refresh
      description: Refresh token opaco, HttpOnly; o navegador o envia sozinho para /api/team/auth.
  parameters:
    ContributionID:
      name: contributionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PropositionID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionID:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ErratumID:
      name: erratumId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LinkID:
      name: linkId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    PropositionNotFound:
      description: "`proposition_not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LinkNotFound:
      description: "`link_not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Session:
      description: |
        Sessão aberta. O refresh token vai só no cookie `nelisa_refresh`;
        nunca no corpo.
      headers:
        Set-Cookie:
          description: "nelisa_refresh=...; Path=/api/team/auth; HttpOnly; Secure; SameSite=Strict"
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    BadRequest:
      description: |
        Entrada inválida: `invalid_json`, `invalid_email`, `invalid_name`,
        `invalid_role`, `password_too_short` (mínimo 8 caracteres) ou
        `password_too_long` (máximo 72 bytes).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: "`unauthenticated` (sem token ou token inválido) ou `session_expired` (token de antes de troca/reset de senha)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "`forbidden`: a role não permite a ação"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UserNotFound:
      description: "`user_not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: "`too_many_requests`: limite por IP excedido"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ContributionKind:
      type: string
      enum: [indication, progress_update, source_request]
    ProgressEventType:
      type: string
      enum: [vote_scheduled, vote_postponed, approved, rejected, removed_from_agenda, other]
    ContributionStatus:
      type: object
      required: [kind, state, submitted_at, decided_at, public_reason, proposition_slug]
      properties:
        kind: { $ref: "#/components/schemas/ContributionKind" }
        state: { type: string, enum: [pending, accepted, rejected] }
        submitted_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        public_reason:
          description: Motivo público da rejeição (só quando rejeitada)
          type: [string, "null"]
        proposition_slug:
          description: Proposição da Atualização, ou a criada a partir da Indicação, se pública
          type: [string, "null"]
    OfficialSource:
      type: object
      required: [id, domain, name, sphere, created_at]
      properties:
        id: { type: string, format: uuid }
        domain: { type: string }
        name: { type: string }
        sphere: { $ref: "#/components/schemas/Sphere" }
        created_at: { type: string, format: date-time }
    RadarItem:
      type: object
      required: [chamber, external_id, name, summary, source_url, agenda_at, presented_at]
      properties:
        chamber: { $ref: "#/components/schemas/Chamber" }
        external_id: { type: string }
        name: { type: string, example: PL 10/2024 }
        summary: { type: string, description: Ementa oficial }
        source_url: { type: string, description: Página da Proposição na Casa }
        agenda_at:
          description: Sessão do Plenário em cuja pauta está (null se só apresentada)
          type: [string, "null"]
          format: date-time
        presented_at:
          type: [string, "null"]
          format: date-time
    RejectReason:
      type: string
      enum: [source_not_confirmed, out_of_scope, already_registered, duplicate, incorrect, other]
      description: Motivo público da rejeição
    PropositionRef:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    TeamContribution:
      type: object
      required: [id, kind, state, sphere, submitted_at, link, link_host, event_type, event_date, domain, source_name, note, proposition, created_proposition, decided_at, public_reason, internal_note]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ContributionKind" }
        state: { type: string, enum: [pending, accepted, rejected] }
        sphere: { $ref: "#/components/schemas/Sphere" }
        submitted_at: { type: string, format: date-time }
        link: { type: string, description: "Indicação: link da Proposição; Atualização: fonte; Pedido: evidência" }
        link_host: { type: string, description: Domínio do link, para mostrar em destaque }
        event_type:
          oneOf:
            - $ref: "#/components/schemas/ProgressEventType"
            - type: "null"
        event_date: { type: [string, "null"], format: date }
        domain: { type: [string, "null"], description: Domínio pedido como Fonte oficial }
        source_name: { type: [string, "null"] }
        note: { type: string, description: "Texto do Leitor: mostrar como texto puro" }
        proposition:
          description: A Proposição da Atualização de tramitação
          oneOf:
            - $ref: "#/components/schemas/PropositionRef"
            - type: "null"
        created_proposition:
          description: A Proposição criada a partir da Indicação
          oneOf:
            - $ref: "#/components/schemas/PropositionRef"
            - type: "null"
        decided_at: { type: [string, "null"], format: date-time }
        public_reason:
          oneOf:
            - $ref: "#/components/schemas/RejectReason"
            - type: "null"
        internal_note: { type: string }
    Version:
      type: object
      required: [version, commit, changelog, build_time]
      properties:
        version: { type: string }
        commit: { type: string }
        changelog: { type: string }
        build_time: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "snake_case estável, para o código tratar" }
            message: { type: string, description: "Texto para a tela, em português" }
    Role:
      type: string
      enum: [editor, reviewer, admin]
      description: Editor ⊂ Revisor (reviewer) ⊂ Admin.
    User:
      type: object
      required: [id, name, email, role, must_change_password, active, deactivated_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        must_change_password:
          type: boolean
          description: Senha definida pelo Admin (temporária). A troca obrigatória ainda não é aplicada.
        active:
          type: boolean
          description: Falso quando o Admin desativou a conta.
        deactivated_at:
          type: [string, "null"]
          format: date-time
          description: Quando a conta foi desativada; null se ativa.
        created_at: { type: string, format: date-time }
    Session:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token: { type: string, description: JWT para o header Authorization }
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: string, format: date-time, description: Quando o token de acesso expira }
        user: { $ref: "#/components/schemas/User" }
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [token, name, email, password]
      properties:
        token: { type: string, description: Valor de BOOTSTRAP_TOKEN }
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, role]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, description: Senha inicial, temporária }
        role: { $ref: "#/components/schemas/Role" }
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 8, description: Nova senha, temporária }
    Chamber:
      type: string
      enum: [camara, senado]
      description: Casa legislativa com API (v1).
    ReviewState:
      type: string
      enum: [draft, in_review, ready]
      description: "Revisão: criado (draft), em revisão (in_review, \"em análise\" para o Leitor), pronto (ready)."
    SourceSearchHit:
      type: object
      required: [external_id, name, kind, number, year, official_summary, presented_at, authors, status, source_url, linked_proposition_id, link_state]
      properties:
        external_id: { type: string }
        name: { type: string, example: PEC 221/2019 }
        kind: { type: string }
        number: { type: integer }
        year: { type: integer }
        official_summary: { type: string, description: Ementa oficial (da fonte) }
        presented_at: { type: [string, "null"], format: date-time }
        authors: { type: array, items: { type: string } }
        status: { type: string }
        source_url: { type: string, description: Página pública na Casa }
        linked_proposition_id:
          type: [string, "null"]
          format: uuid
          description: Proposição a que o registro já está ligado, se houver
        link_state:
          type: [string, "null"]
          enum: [confirmed, suggested, null]
    SourceSearchResult:
      type: object
      required: [chamber, unavailable, hits]
      properties:
        chamber: { $ref: "#/components/schemas/Chamber" }
        unavailable: { type: boolean, description: A fonte falhou nesta busca }
        hits:
          type: array
          items: { $ref: "#/components/schemas/SourceSearchHit" }
    ImportRequest:
      type: object
      additionalProperties: false
      required: [chamber, external_id]
      properties:
        chamber: { $ref: "#/components/schemas/Chamber" }
        external_id: { type: string, maxLength: 64, description: ID do registro na API da Casa }
    ImportResult:
      type: object
      required: [proposition_id, created, suggested_links, suggestions_unavailable]
      properties:
        proposition_id: { type: string, format: uuid }
        created: { type: boolean }
        suggested_links: { type: integer, description: Vínculos de outras Casas sugeridos para o Editor conferir }
        suggestions_unavailable:
          type: array
          items: { $ref: "#/components/schemas/Chamber" }
          description: Casas que não responderam à procura de candidatos
    SourceLink:
      type: object
      description: Vínculo de fonte (só a equipe vê estes campos).
      required: [id, chamber, external_id, state, source_name, source_url, confirmed_by, confirmed_at, last_synced_at, last_sync_error, created_at]
      properties:
        id: { type: string, format: uuid }
        chamber: { $ref: "#/components/schemas/Chamber" }
        external_id: { type: string }
        state: { type: string, enum: [suggested, confirmed] }
        source_name: { type: string, description: Como a Casa chama a Proposição }
        source_url: { type: string }
        confirmed_by: { type: [string, "null"], format: uuid }
        confirmed_at: { type: [string, "null"], format: date-time }
        last_synced_at: { type: [string, "null"], format: date-time }
        last_sync_error: { type: string, description: Vazio se a última Sincronização deu certo }
        created_at: { type: string, format: date-time }
    TeamAttachedRef:
      type: object
      required: [id, name]
      properties:
        id: { type: [string, "null"], format: uuid, description: "null enquanto a principal não estiver cadastrada" }
        name: { type: string }
    TimelineEntry:
      type: object
      required: [chamber, at, body, description, situation, dispatch, manual, source_url]
      properties:
        chamber: { $ref: "#/components/schemas/Chamber" }
        at: { type: string, format: date-time }
        body: { type: string, description: Órgão (sigla) }
        description: { type: string }
        situation: { type: string }
        dispatch: { type: string }
        manual: { type: boolean, description: "Evento de uma Atualização de tramitação aceita pela equipe, não da fonte oficial" }
        source_url: { type: string, description: "Link de fonte do evento manual (vazio nos da fonte oficial)" }
        contribution_id:
          type: string
          format: uuid
          description: Só na resposta da equipe, nos eventos manuais (para apagá-los)
    TeamProposition:
      type: object
      required: [id, slug, name, kind, number, year, sphere, origin_chamber, official_summary, presented_at, official_text_url, authors, status, superseded, attached_to, review_state, links, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, example: pec-221-2019 }
        name: { type: string, example: PEC 221/2019 }
        kind: { type: string }
        number: { type: integer }
        year: { type: integer }
        sphere: { type: string, enum: [federal, state, municipal] }
        origin_chamber: { type: string }
        official_summary: { type: string, description: Ementa oficial (da fonte) }
        presented_at: { type: [string, "null"], format: date-time }
        official_text_url: { type: string }
        authors: { type: array, items: { type: string } }
        status: { type: string }
        superseded: { type: boolean, description: Prejudicada }
        attached_to:
          oneOf:
            - $ref: "#/components/schemas/TeamAttachedRef"
            - type: "null"
        review_state: { $ref: "#/components/schemas/ReviewState" }
        links:
          type: array
          items: { $ref: "#/components/schemas/SourceLink" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamPropositionDetail:
      allOf:
        - $ref: "#/components/schemas/TeamProposition"
        - type: object
          required: [attached, timeline]
          properties:
            attached:
              type: array
              items: { $ref: "#/components/schemas/TeamAttachedRef" }
            timeline:
              type: array
              items: { $ref: "#/components/schemas/TimelineEntry" }
        - $ref: "#/components/schemas/TeamEditorial"
    PublicRef:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: [string, "null"], description: "null se a Proposição não é pública" }
    PublicSource:
      type: object
      required: [chamber, name, url]
      properties:
        chamber: { $ref: "#/components/schemas/Chamber" }
        name: { type: string }
        url: { type: string }
    PublicProposition:
      type: object
      description: |
        Dados oficiais e, com Versão vigente, Resumo, Resumo curto, Temas e
        Selo dela. Nada interno (estado de Revisão, conteúdo da Versão em
        análise, Autoria, quem aprovou, Posse, "a confirmar", revisão,
        quem confirmou vínculos, erros de Sincronização, sugestões).
      required: [slug, name, kind, number, year, sphere, origin_chamber, official_summary, presented_at, official_text_url, authors, status, superseded, attached_to, attached, sources, under_review, updated_at, summary, short_summary, topics, review_badge, pending_version]
      properties:
        slug: { type: string, example: pec-221-2019 }
        name: { type: string, example: PEC 221/2019 }
        kind: { type: string }
        number: { type: integer }
        year: { type: integer }
        sphere: { type: string, enum: [federal, state, municipal] }
        origin_chamber: { type: string }
        official_summary: { type: string, description: Ementa oficial (da fonte) }
        presented_at: { type: [string, "null"], format: date-time }
        official_text_url: { type: string, description: Link do Documento integral na Casa }
        authors: { type: array, items: { type: string } }
        status: { type: string, description: Situação atual oficial }
        superseded: { type: boolean, description: Prejudicada }
        attached_to:
          oneOf:
            - $ref: "#/components/schemas/PublicRef"
            - type: "null"
        attached:
          type: array
          items: { $ref: "#/components/schemas/PublicRef" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/PublicSource" }
        under_review: { type: boolean, description: "\"Em análise\" (sem Versão vigente): só dados oficiais" }
        updated_at: { type: string, format: date-time }
        summary: { type: string, description: "Resumo da Versão vigente; vazio sem ela" }
        short_summary: { type: string, description: "Resumo curto da Versão vigente; vazio sem ela" }
        topics:
          type: array
          items: { type: string }
          description: Nomes dos Temas da Versão vigente; vazio sem ela
        review_badge:
          type: [integer, "null"]
          enum: [1, 2, null]
          description: "Selo de revisão: 2 (\"revisado por 2 pessoas\") ou 1; null sem Versão vigente. Nunca nomes."
        pending_version:
          oneOf:
            - $ref: "#/components/schemas/PublicPendingVersion"
            - type: "null"
          description: Aviso "há texto novo em análise" (só com Versão vigente). Nada do conteúdo dela.
    PublicPendingVersion:
      type: object
      required: [label, official_text_url]
      properties:
        label: { type: string, example: Substitutivo da CCJ }
        official_text_url: { type: string }
    PublicPropositionDetail:
      allOf:
        - $ref: "#/components/schemas/PublicProposition"
        - type: object
          required: [timeline, errata, annotated_text]
          properties:
            annotated_text:
              oneOf:
                - type: array
                  items: { $ref: "#/components/schemas/PublicProvision" }
                - type: "null"
              description: |
                Documento comentado da Versão vigente: os Dispositivos na ordem
                de leitura, com os Comentários. null sem Versão vigente ou sem
                Estruturação confirmada. Nunca traz o texto fonte, avisos,
                Comentários a confirmar ou apagados, nem nomes da equipe.
            timeline:
              type: array
              items: { $ref: "#/components/schemas/TimelineEntry" }
            errata:
              type: array
              items: { $ref: "#/components/schemas/PublicErratum" }
              description: |
                Erratas aprovadas da Versão vigente, da mais nova para a mais
                antiga. Pendentes, recusadas e retiradas nunca saem; nem quem
                propôs ou decidiu.
    PublicProvision:
      type: object
      additionalProperties: false
      required: [address, label, kind, text, depth, comments]
      properties:
        address: { type: string, description: "Âncora estável (link #address)" }
        label: { type: string }
        kind: { type: string, enum: [ementa, preamble, heading, article, paragraph, item, point, subitem, justification] }
        text: { type: string }
        depth: { type: integer }
        comments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [body]
            properties:
              body: { type: string }
    PublicErratum:
      type: object
      additionalProperties: false
      required: [approved_at, said, correct]
      properties:
        approved_at: { type: string, format: date-time }
        said: { type: string, maxLength: 500, description: '"Dizia X"' }
        correct: { type: string, maxLength: 500, description: '"O correto é Y"' }
    Sphere:
      type: string
      enum: [federal, state, municipal]
    PropositionVersion:
      type: object
      required: [id, seq, label, official_text_url, state, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        label: { type: string, maxLength: 120 }
        official_text_url: { type: string, description: Link do Documento integral desta Versão }
        state: { type: string, enum: [pending, current, superseded], description: "em análise, vigente, substituída" }
        created_by: { type: [string, "null"], format: uuid, description: "null quando veio da Importação" }
        created_at: { type: string, format: date-time }
    VersionContent:
      type: object
      description: Conteúdo editorial de uma Versão (só a equipe vê estes campos).
      required: [version_id, summary, short_summary, topic_ids, needs_confirmation, authors, revision, updated_by, updated_at]
      properties:
        version_id: { type: string, format: uuid }
        summary: { type: string, maxLength: 5000, description: Resumo }
        short_summary: { type: string, maxLength: 280, description: Resumo curto }
        topic_ids:
          type: array
          maxItems: 3
          items: { type: string, format: uuid }
        needs_confirmation: { type: boolean, description: Copiado da Versão anterior e ainda não confirmado }
        authors:
          type: array
          items: { type: string, format: uuid }
          description: Autoria editorial (ids; nomes em `people` no detalhe)
        revision: { type: integer, description: Trava otimista; mande de volta ao gravar }
        updated_by: { type: [string, "null"], format: uuid }
        updated_at: { type: string, format: date-time }
    CreateVersionRequest:
      type: object
      additionalProperties: false
      required: [label, official_text_url]
      properties:
        label: { type: string, maxLength: 120, example: Substitutivo da CCJ }
        official_text_url: { type: string, description: Link http(s) do Documento integral }
    UpdateContentRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        summary: { type: string, maxLength: 5000 }
        short_summary: { type: string, maxLength: 280 }
        topic_ids:
          type: array
          maxItems: 3
          items: { type: string, format: uuid }
        revision: { type: integer, description: O revision lido }
    ConfirmContentRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, description: O revision lido }
    Topic:
      type: object
      required: [id, name, active, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    Claim:
      type: object
      description: Posse (só a equipe vê).
      required: [holder_id, holder_name, claimed_at, last_activity_at, expires_at]
      properties:
        holder_id: { type: string, format: uuid }
        holder_name: { type: string }
        claimed_at: { type: string, format: date-time }
        last_activity_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: 3 dias depois da última atividade }
    TeamClaim:
      allOf:
        - $ref: "#/components/schemas/Claim"
        - type: object
          required: [mine, can_release]
          properties:
            mine: { type: boolean, description: A Posse é de quem pergunta }
            can_release: { type: boolean, description: "Quem pergunta pode soltar esta Posse (a própria, ou Revisor/Admin)" }
    ApprovalInfo:
      type: object
      required: [version_id, approved_by, approved_at, four_eyes, second_review_by, second_review_at, pending_second_review]
      properties:
        version_id: { type: string, format: uuid }
        approved_by: { type: string, format: uuid }
        approved_at: { type: string, format: date-time }
        four_eyes: { type: boolean }
        second_review_by: { type: [string, "null"], format: uuid }
        second_review_at: { type: [string, "null"], format: date-time }
        pending_second_review: { type: boolean }
    Blocker:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            `role`, `no_pending_version`, `not_in_review`, `four_eyes`,
            `summary`, `short_summary`, `topics`, `inactive_topics`,
            `needs_confirmation`, `structuring_pending` (Estruturação
            sendo buscada ou a conferir) ou `comments_unconfirmed`.
        message: { type: string, description: Texto para a tela }
    TeamEditorial:
      type: object
      required: [versions, pending_content, current_content, topics, claim, review_badge, current_approval, can_edit, can_create_version, can_approve, approve_blockers, approval_breaks_four_eyes, can_second_review, can_minor_fix, can_propose_erratum, minor_fixes, pending_erratum, errata, people, pending_structuring, current_structuring, can_edit_structuring, can_retry_structuring, pending_comments, current_comments, can_comment]
      properties:
        pending_comments:
          type: array
          items: { $ref: "#/components/schemas/TeamComment" }
          description: Comentários vivos da Versão em análise
        current_comments:
          type: array
          items: { $ref: "#/components/schemas/TeamComment" }
          description: Comentários vivos da Versão vigente
        can_comment: { type: boolean, description: "Pode comentar a Versão em análise (Estruturação confirmada, Posse livre ou sua)" }
        pending_structuring:
          oneOf:
            - $ref: "#/components/schemas/TeamStructuring"
            - type: "null"
          description: Estruturação da Versão em análise (null em Versão antiga, sem Estruturação)
        current_structuring:
          oneOf:
            - $ref: "#/components/schemas/TeamStructuring"
            - type: "null"
        can_edit_structuring: { type: boolean, description: "Pode corrigir/colar o texto e confirmar (Versão em análise, Posse livre ou sua)" }
        can_retry_structuring: { type: boolean, description: "Pode pedir outra busca do PDF oficial" }
        versions:
          type: array
          items: { $ref: "#/components/schemas/PropositionVersion" }
        pending_content:
          oneOf:
            - $ref: "#/components/schemas/VersionContent"
            - type: "null"
        current_content:
          oneOf:
            - $ref: "#/components/schemas/VersionContent"
            - type: "null"
        topics:
          type: array
          items: { $ref: "#/components/schemas/Topic" }
          description: Todos os Temas, para mostrar nomes
        claim:
          oneOf:
            - $ref: "#/components/schemas/TeamClaim"
            - type: "null"
        review_badge: { type: [integer, "null"], enum: [1, 2, null], description: Selo da Versão vigente }
        current_approval:
          oneOf:
            - $ref: "#/components/schemas/ApprovalInfo"
            - type: "null"
        can_edit: { type: boolean, description: Pode gravar o conteúdo da Versão em análise (Posse livre ou sua) }
        can_create_version: { type: boolean }
        can_approve: { type: boolean }
        approve_blockers:
          type: array
          items: { $ref: "#/components/schemas/Blocker" }
          description: Por que quem pergunta não pode aprovar agora (vazio se pode)
        approval_breaks_four_eyes: { type: boolean, description: "Admin autor: se aprovar, fica a Segunda revisão pendente" }
        can_second_review: { type: boolean }
        can_minor_fix:
          type: boolean
          description: "Pode aplicar Correção menor na vigente: Proposição pronta, sem Errata pendente, Posse livre ou sua"
        can_propose_erratum: { type: boolean, description: "Pode propor Errata: Proposição pronta, sem Errata pendente" }
        minor_fixes:
          type: array
          items: { $ref: "#/components/schemas/TeamMinorFix" }
          description: Correções menores a conferir, da mais antiga para a mais nova
        pending_erratum:
          oneOf:
            - $ref: "#/components/schemas/TeamErratum"
            - type: "null"
          description: Errata pendente da Versão vigente
        errata:
          type: array
          items: { $ref: "#/components/schemas/TeamErratum" }
          description: Histórico das outras Erratas, da mais nova para a mais antiga
        people:
          type: object
          additionalProperties: { type: string }
          description: Nomes da equipe por id (Autoria, Posse, aprovação, correções)
    TeamComment:
      type: object
      required: [id, version_id, provision_address, body, needs_confirmation, authors, revision, created_by, created_at, updated_by, updated_at]
      properties:
        id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        provision_address: { type: string }
        body: { type: string, maxLength: 3000 }
        needs_confirmation: { type: boolean, description: Trazido da Versão anterior, a confirmar }
        authors:
          type: array
          items: { type: string, format: uuid }
        revision: { type: integer }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_by: { type: [string, "null"], format: uuid }
        updated_at: { type: string, format: date-time }
    CreateCommentRequest:
      type: object
      required: [provision_address, body]
      properties:
        provision_address: { type: string }
        body: { type: string, maxLength: 3000 }
    UpdateCommentRequest:
      type: object
      required: [body, revision]
      properties:
        body: { type: string, maxLength: 3000 }
        revision: { type: integer }
    ReprocessStructuringRequest:
      type: object
      required: [source_text, revision]
      properties:
        source_text: { type: string, maxLength: 500000, description: Texto corrigido ou colado }
        revision: { type: integer, description: Revisão da Estruturação lida }
    TeamStructuring:
      type: object
      description: |
        Estruturação de uma Versão: o texto (interno, nunca vai ao público)
        que gerou os Dispositivos, os avisos do parser e a árvore.
      required: [version_id, state, failure, source_text, warnings, provisions, revision, updated_by, updated_at, confirmed_by, confirmed_at]
      properties:
        version_id: { type: string, format: uuid }
        state:
          type: string
          enum: [fetching, ready_to_check, confirmed, manual]
          description: "fetching: buscando o PDF; ready_to_check: a conferir; manual: a busca falhou, cole o texto"
        failure:
          type: [string, "null"]
          enum: [no_url, host_not_allowed, not_found, not_pdf, too_large, no_text, network, null]
        source_text: { type: string }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/StructuringWarning" }
        provisions:
          type: array
          items: { $ref: "#/components/schemas/TeamProvision" }
          description: Dispositivos na ordem de leitura
        revision: { type: integer }
        updated_by: { type: [string, "null"], format: uuid, description: "null: busca automática" }
        updated_at: { type: string, format: date-time }
        confirmed_by: { type: [string, "null"], format: uuid }
        confirmed_at: { type: [string, "null"], format: date-time }
    StructuringWarning:
      type: object
      required: [code, line, address]
      properties:
        code:
          type: string
          description: "`no_ementa`, `no_articles`, `duplicate_address`, `article_out_of_order`, `article_gap`, `orphan` ou `unclosed_quote`"
        line: { type: integer, description: "Linha do texto (1 = primeira; 0 = sem linha)" }
        address: { type: [string, "null"] }
    TeamProvision:
      type: object
      required: [address, parent, kind, label, text, depth, commentable]
      properties:
        address: { type: string, description: "Âncora estável na Versão, ex. art-3.par-2.inc-4" }
        parent: { type: string, description: "Endereço do Dispositivo acima (vazio no topo)" }
        kind: { type: string, enum: [ementa, preamble, heading, article, paragraph, item, point, subitem, justification] }
        label: { type: string, description: "Ex. Art. 3º, § 2º, inciso IV" }
        text: { type: string }
        depth: { type: integer }
        commentable: { type: boolean }
    ContentSnapshot:
      type: object
      required: [summary, short_summary, topic_ids]
      properties:
        summary: { type: string }
        short_summary: { type: string }
        topic_ids:
          type: array
          items: { type: string, format: uuid }
    MinorFixField:
      type: string
      enum: [summary, short_summary, topic_ids]
    MinorFix:
      type: object
      required: [id, version_id, fields, before, after, created_by, created_at, checked_by, checked_at]
      properties:
        id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        fields:
          type: array
          items: { $ref: "#/components/schemas/MinorFixField" }
        before: { $ref: "#/components/schemas/ContentSnapshot" }
        after: { $ref: "#/components/schemas/ContentSnapshot" }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        checked_by: { type: [string, "null"], format: uuid }
        checked_at: { type: [string, "null"], format: date-time }
    TeamMinorFix:
      type: object
      required: [id, version_id, fields, before, after, created_by, created_at, can_check_minor_fix]
      properties:
        id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        fields:
          type: array
          items: { $ref: "#/components/schemas/MinorFixField" }
        before: { $ref: "#/components/schemas/ContentSnapshot" }
        after: { $ref: "#/components/schemas/ContentSnapshot" }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        can_check_minor_fix: { type: boolean, description: "Quem pergunta pode conferir (Revisor ou Admin que não a fez)" }
    ErratumState:
      type: string
      enum: [pending, approved, rejected, withdrawn]
    Erratum:
      type: object
      required: [id, version_id, proposed, said, correct, base_revision, state, created_by, created_at, decided_by, decided_at, reason]
      properties:
        id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        proposed: { $ref: "#/components/schemas/ContentSnapshot" }
        said: { type: string, maxLength: 500 }
        correct: { type: string, maxLength: 500 }
        base_revision: { type: integer, description: revision do conteúdo vigente quando foi proposta }
        state: { $ref: "#/components/schemas/ErratumState" }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        decided_by: { type: [string, "null"], format: uuid }
        decided_at: { type: [string, "null"], format: date-time }
        reason: { type: string, description: 'Motivo interno da recusa ("" nos outros estados)' }
    TeamErratum:
      allOf:
        - $ref: "#/components/schemas/Erratum"
        - type: object
          required: [stale, can_decide_erratum, can_withdraw_erratum]
          properties:
            stale: { type: boolean, description: "O conteúdo vigente mudou desde a proposta: aprovar dá 409" }
            can_decide_erratum: { type: boolean, description: "Quem pergunta pode aprovar ou recusar (Revisor ou Admin que não a propôs)" }
            can_withdraw_erratum: { type: boolean, description: Quem pergunta pode retirar (quem propôs) }
    ProposeErratumRequest:
      type: object
      additionalProperties: false
      required: [said, correct, revision]
      properties:
        summary: { type: string, maxLength: 5000 }
        short_summary: { type: string, maxLength: 280 }
        topic_ids:
          type: array
          maxItems: 3
          items: { type: string, format: uuid }
        said: { type: string, maxLength: 500, description: '"Dizia X" (nota pública)' }
        correct: { type: string, maxLength: 500, description: '"O correto é Y" (nota pública)' }
        revision: { type: integer, description: O revision lido do conteúdo vigente }
    Approval:
      type: object
      required: [version_id, approved_at, four_eyes, second_review_at, pending_second_review, review_badge]
      properties:
        version_id: { type: string, format: uuid }
        approved_at: { type: string, format: date-time }
        four_eyes: { type: boolean }
        second_review_at: { type: [string, "null"], format: date-time }
        pending_second_review: { type: boolean }
        review_badge: { type: integer, enum: [1, 2] }
    QueueItem:
      type: object
      required: [proposition_id, name, slug, sphere, reason, version, since, claim, missing, contribution]
      properties:
        proposition_id:
          description: null numa Contribuição que não é de uma Proposição (Indicação, Pedido de fonte oficial)
          type: [string, "null"]
          format: uuid
        name: { type: string, description: "Nome da Proposição; na Indicação e no Pedido, o domínio" }
        slug: { type: string }
        sphere: { $ref: "#/components/schemas/Sphere" }
        reason: { type: string, enum: [review, second_review, minor_fix_check, erratum, contribution] }
        version:
          description: null nos itens de Contribuição
          oneOf:
            - type: object
              required: [id, seq, label]
              properties:
                id: { type: string, format: uuid }
                seq: { type: integer }
                label: { type: string }
            - type: "null"
        since: { type: string, format: date-time, description: Desde quando está na Fila }
        claim:
          oneOf:
            - $ref: "#/components/schemas/Claim"
            - type: "null"
        missing:
          type: array
          items: { $ref: "#/components/schemas/Blocker" }
          description: O que falta no conteúdo para aprovar (itens de revisão)
        contribution:
          description: Só nos itens de Contribuição
          oneOf:
            - type: object
              required: [id, kind, subject]
              properties:
                id: { type: string, format: uuid }
                kind: { $ref: "#/components/schemas/ContributionKind" }
                subject: { type: string, description: O domínio pedido ou o host do link }
            - type: "null"
